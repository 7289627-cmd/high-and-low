# Builds the Android app in the cloud. Start it from the Actions tab ("Run workflow").
# Without signing secrets it makes a debug APK you can install on a phone for testing.
# With the four ANDROID_* secrets set (added Nov 15, 2026) it also makes a signed .aab for Google Play.
name: Android build
on:
  workflow_dispatch:
    inputs:
      ads:
        description: Include ads only (requires configured production AdMob IDs)
        type: boolean
        default: false
      demo_ads:
        description: Use Google demo ads with the configured app ID for consent QA when available
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/android.yml']
permissions:
  contents: write   # needed to publish the signed bundle to the android-builds branch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: dev/app
    env:
      HAVE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HL_ADS_ONLY: ${{ inputs.ads && '1' || '0' }}
      HL_ADS_DEMO: ${{ inputs.demo_ads && '1' || '0' }}
      HL_ADMOB_PLATFORM: android
      HL_ADMOB_APP_ID: ${{ (inputs.ads || inputs.demo_ads) && vars.HIGH_LOW_ADMOB_ANDROID_APP_ID || '' }}
      HL_ADMOB_INTERSTITIAL_ID: ${{ inputs.ads && !inputs.demo_ads && vars.HIGH_LOW_ADMOB_ANDROID_INTERSTITIAL_ID || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install wrapper packages
        run: npm ci
      - name: Build the game into www
        run: |
          bash sync-web.sh
      - name: Create the Android project
        run: |
          npx cap add android
          node scripts/configure-native.mjs --android-app-id "$HL_ADMOB_APP_ID"
          cp -R ../store/launch/assets ./assets
          npx --yes @capacitor/assets generate --android --iconBackgroundColor '#7FD0E4' --splashBackgroundColor '#7FD0E4'
          npx cap sync android
      - name: Set the version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName\|applicationId" android/app/build.gradle
      - name: Debug APK (installable test build)
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Signed bundle for Google Play
        if: env.HAVE_KEY == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cd android && ./gradlew --no-daemon bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Publish the signed bundle to the android-builds branch
        if: env.HAVE_KEY == 'true' && github.ref == 'refs/heads/main' && !inputs.demo_ads
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp android/app/build/outputs/bundle/release/*.aab "$RUNNER_TEMP/out/high-and-low-${{ github.run_number }}.aab"
          cd "$RUNNER_TEMP/out"
          git init -q -b android-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -q -m "Build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-builds
      - uses: actions/upload-artifact@v4
        with:
          name: high-and-low-android-${{ github.run_number }}
          path: |
            dev/app/android/app/build/outputs/apk/debug/*.apk
            dev/app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
