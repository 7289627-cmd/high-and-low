name: Prepare Apple listing and TestFlight notes
on:
  workflow_dispatch:
    inputs:
      upload_screenshots:
        description: Upload and verify the localized iPhone screenshots only
        type: boolean
        default: false
      build_number:
        description: High & Low iOS build number for the beta notes
        required: true
        type: string
      prepare_private_group:
        description: Prepare an empty private internal test group for this build
        type: boolean
        default: false
      inspect_only:
        description: Read build and group status without changing anything
        type: boolean
        default: false
      assign_owner_group:
        description: Add only this build to the existing internal owner TestFlight group
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: high-and-low-apple-metadata
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify draft field handling and private build assignment
        run: |
          python3 dev/app/scripts/ios-metadata-test.py
          python3 dev/app/scripts/ios-owner-beta-test.py
      - name: Fill missing English listing fields and beta notes
        if: ${{ !inputs.upload_screenshots && !inputs.inspect_only && !inputs.assign_owner_group }}
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 dev/app/scripts/ios-metadata.py "$BUILD_NUMBER"
      - name: Apply and verify translations for the editable App Store listing
        if: ${{ !inputs.upload_screenshots && !inputs.inspect_only && !inputs.assign_owner_group && !inputs.prepare_private_group }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 dev/app/scripts/ios-metadata.py --localize
      - name: Prepare private TestFlight group
        if: ${{ !inputs.upload_screenshots && !cancelled() && !inputs.inspect_only && !inputs.assign_owner_group && inputs.prepare_private_group }}
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 dev/app/scripts/ios-owner-beta.py "$BUILD_NUMBER"
      - name: Inspect TestFlight status
        if: ${{ !inputs.upload_screenshots && !cancelled() && (inputs.inspect_only || (!inputs.assign_owner_group && inputs.prepare_private_group)) }}
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 dev/app/scripts/ios-owner-beta.py "$BUILD_NUMBER" --inspect
      - name: Assign the exact build to the owner TestFlight group
        if: ${{ !inputs.upload_screenshots && !inputs.inspect_only && inputs.assign_owner_group }}
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 dev/app/scripts/ios-owner-beta.py "$BUILD_NUMBER" --assign

      - name: Upload and verify localized iPhone screenshots
        if: ${{ inputs.upload_screenshots && !inputs.inspect_only && !inputs.prepare_private_group && !inputs.assign_owner_group }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 dev/app/scripts/ios-screenshots-test.py
          python3 dev/app/scripts/ios-screenshots.py dev/store/iphone-localized
