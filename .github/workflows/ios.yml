# Builds the iPhone app in the cloud on a Mac runner. Start it from the Actions tab ("Run workflow").
# Without the App Store Connect secrets it only checks that the app compiles.
# With ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 set it signs the app and uploads it to TestFlight.
name: iOS build
on:
  workflow_dispatch:
    inputs:
      ads:
        description: Include ads and Remove Ads
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dev/app
    env:
      HAVE_ASC: ${{ secrets.ASC_KEY_P8 != '' }}
      TEAM_ID: GFV2WKFK58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wrapper packages
        run: npm ci
      - name: Build the game into www
        run: |
          if [ "${{ inputs.ads }}" = "true" ]; then bash sync-web.sh; else HL_NO_ADS=1 bash sync-web.sh; fi
      - name: Create the iOS project
        run: |
          npx cap add ios
          node scripts/configure-native.mjs
          cp -R ../store/launch/assets ./assets
          npx --yes @capacitor/assets generate --ios --iconBackgroundColor '#7FD0E4' --splashBackgroundColor '#7FD0E4'
          npx cap sync ios
          ls ios/App
          xcodebuild -version
      - name: Compile check (no signing)
        if: env.HAVE_ASC != 'true'
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          set -o pipefail
          xcodebuild $T -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO | tail -60
      - name: Archive, sign and upload to TestFlight
        if: env.HAVE_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          cd ios/App
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          set -o pipefail
          xcodebuild $T -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" MARKETING_VERSION="1.0.${{ github.run_number }}" \
            "${AUTH[@]}" | tail -60
          cat > "$RUNNER_TEMP/export.plist" <<-PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -40
          rm -f "$KEY"
