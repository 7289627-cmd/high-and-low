# Builds the iPhone app in the cloud on a Mac runner. Start it from the Actions tab ("Run workflow").
# Without the App Store Connect secrets it only checks that the app compiles.
# With ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 set (added Nov 16, 2026, key id fixed Nov 17, 2026) it signs the app and uploads it to TestFlight.
name: iOS build
on:
  workflow_dispatch:
    inputs:
      ads:
        description: Include ads only (requires configured production AdMob IDs)
        type: boolean
        default: false
      demo_ads:
        description: Use Google demo ads with the configured app ID for consent QA when available
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 60
    defaults:
      run:
        working-directory: dev/app
    env:
      HAVE_ASC: ${{ secrets.ASC_KEY_P8 != '' }}
      TEAM_ID: GFV2WKFK58
      HL_ADS_ONLY: ${{ inputs.ads && '1' || '0' }}
      HL_ADS_DEMO: ${{ inputs.demo_ads && '1' || '0' }}
      HL_ADMOB_PLATFORM: ios
      HL_ADMOB_APP_ID: ${{ (inputs.ads || inputs.demo_ads) && vars.HIGH_LOW_ADMOB_IOS_APP_ID || '' }}
      HL_ADMOB_INTERSTITIAL_ID: ${{ inputs.ads && !inputs.demo_ads && vars.HIGH_LOW_ADMOB_IOS_INTERSTITIAL_ID || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wrapper packages
        run: npm ci
      - name: Build the game into www
        run: |
          bash sync-web.sh
      - name: Create the iOS project
        run: |
          npx cap add ios
          node scripts/configure-native.mjs --ios-app-id "$HL_ADMOB_APP_ID"
          cp -R ../store/launch/assets ./assets
          npx --yes @capacitor/assets generate --ios --iconBackgroundColor '#7FD0E4' --splashBackgroundColor '#7FD0E4'
          npx cap sync ios
          ls ios/App
          xcodebuild -version
      - name: Compile check (no signing)
        if: env.HAVE_ASC != 'true'
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          set -o pipefail
          xcodebuild $T -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO | tail -60
      - name: Check the Apple key (prints no secret values)
        if: env.HAVE_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 - <<'PY'
          import os, re, json, time, base64, hashlib, subprocess, tempfile, urllib.request, urllib.error
          kid=os.environ.get('ASC_KEY_ID',''); iss=os.environ.get('ASC_ISSUER_ID',''); p8=os.environ.get('ASC_KEY_P8','')
          h=lambda v: hashlib.sha256(v.encode()).hexdigest()[:8]
          print('key id: length', len(kid), 'stripped length', len(kid.strip()), 'looks right', bool(re.fullmatch(r'[A-Z0-9]{10}', kid)), 'fingerprint', h(kid.strip()))
          print('issuer id: length', len(iss), 'stripped length', len(iss.strip()), 'looks like a uuid', bool(re.fullmatch(r'[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', iss)), 'fingerprint', h(iss.strip()))
          lines=[l for l in p8.strip().splitlines()]
          print('p8: characters', len(p8), 'lines', len(lines), 'has BEGIN', 'BEGIN PRIVATE KEY' in p8, 'has END', 'END PRIVATE KEY' in p8)
          body=''.join(l.strip() for l in lines if 'PRIVATE KEY' not in l)
          pem='-----BEGIN PRIVATE KEY-----\n'+'\n'.join(body[i:i+64] for i in range(0,len(body),64))+'\n-----END PRIVATE KEY-----\n'
          f=tempfile.NamedTemporaryFile('w',suffix='.p8',delete=False); f.write(pem); f.close()
          r=subprocess.run(['openssl','pkey','-in',f.name,'-noout','-text'],capture_output=True,text=True)
          print('p8 parses as a key:', r.returncode==0, (r.stdout.splitlines() or [''])[0][:40], r.stderr[:120].replace('\n',' '))
          b64=lambda b: base64.urlsafe_b64encode(b).rstrip(b'=').decode()
          now=int(time.time())
          head=b64(json.dumps({'alg':'ES256','kid':kid.strip(),'typ':'JWT'}).encode())
          pay=b64(json.dumps({'iss':iss.strip(),'iat':now,'exp':now+600,'aud':'appstoreconnect-v1'}).encode())
          msg=(head+'.'+pay).encode()
          sig=subprocess.run(['openssl','dgst','-sha256','-sign',f.name],input=msg,capture_output=True).stdout
          os.unlink(f.name)
          def der2raw(d):
              i=2 if d[1]<0x80 else 2+(d[1]&0x7f)
              out=b''
              for _ in range(2):
                  assert d[i]==2; n=d[i+1]; v=d[i+2:i+2+n]; i+=2+n
                  out+=v[-32:].rjust(32,b'\0')
              return out
          tok=head+'.'+pay+'.'+b64(der2raw(sig)) if sig else ''
          req=urllib.request.Request('https://api.appstoreconnect.apple.com/v1/apps?limit=1',headers={'Authorization':'Bearer '+tok})
          try:
              with urllib.request.urlopen(req,timeout=30) as resp:
                  print('App Store Connect API answered', resp.status, '(the key works)')
                  print('::notice::Apple key check: API answered', resp.status, 'key id length', len(kid.strip()))
          except urllib.error.HTTPError as e:
              print('App Store Connect API answered', e.code, e.read()[:300].decode('utf8','replace'))
              print('::warning::Apple key check: API answered', e.code, 'key id length', len(kid.strip()), 'key id fingerprint', h(kid.strip()))
          except Exception as e:
              print('App Store Connect API call failed:', type(e).__name__, str(e)[:200])
          PY
      - name: Set up App Store signing
        if: env.HAVE_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 scripts/ios-signing.py setup
      - name: Archive, sign and upload to TestFlight
        if: env.HAVE_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          WORK="$(mktemp -d "$RUNNER_TEMP/ios-export.XXXXXX")"
          trap 'rm -rf "$WORK"' EXIT
          # Tidy pasted identifiers; write the private key only when altool needs it.
          ASC_KEY_ID="$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
          ASC_ISSUER_ID="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"
          cd ios/App
          if [ -d App.xcworkspace ]; then T="-workspace App.xcworkspace"; else T="-project App.xcodeproj"; fi
          set -o pipefail
          # The App target was switched to manual App Store signing by scripts/ios-signing.py.
          xcodebuild $T -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" MARKETING_VERSION="1.0.${{ github.run_number }}" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -60 || {
              grep -E "error:|rror Domain|requires|No profiles|No Account|denied|forbidden|No signing certificate" "$RUNNER_TEMP/archive.log" | sort -u | head -8 | while IFS= read -r l; do echo "::error::archive: ${l:0:900}"; done
              exit 1; }
          # Verify the app Apple will receive is iPhone-only.
          plutil -extract UIDeviceFamily json -o - "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/Info.plist" | jq -e '. == [1]'
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>com.highandlow.game</key><string>$HL_PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$WORK/export" 2>&1 | tee "$RUNNER_TEMP/export.log" | tail -40 || {
              grep -E "error:|rror Domain|requires|No profiles|denied|forbidden|ERROR" "$RUNNER_TEMP/export.log" | sort -u | head -8 | while IFS= read -r l; do echo "::error::export: ${l:0:900}"; done
              exit 1; }
          # Validate the exported payload, not just the archive, before any upload.
          IPA="$(find "$WORK/export" -maxdepth 1 -name '*.ipa' -type f -print)"
          test "$(printf '%s\n' "$IPA" | grep -c .)" -eq 1
          IPA="$IPA" EXPECTED_BUILD="${{ github.run_number }}" python3 - <<'PY'
          import json, os, pathlib, plistlib, re, zipfile
          with zipfile.ZipFile(os.environ['IPA']) as ipa:
              names = [n for n in ipa.namelist() if n.startswith('Payload/') and n.endswith('.app/Info.plist') and n.count('/') == 2]
              if len(names) != 1: raise SystemExit('Expected exactly one top-level app in IPA')
              info = plistlib.loads(ipa.read(names[0]))
              public = names[0].removesuffix('Info.plist') + 'public/'
              html = ipa.read(public + 'index.html').decode()
              translations = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'dev/src/locales'
              expected_catalogs = {p.stem: json.loads(p.read_text(encoding='utf-8-sig')) for p in translations.glob('*.json')}
              packed, _ = json.JSONDecoder().raw_decode(html.split('window.HL_TRANSLATIONS=', 1)[1])
              if (not expected_catalogs or packed != expected_catalogs
                      or sorted(info.get('CFBundleLocalizations', [])) != sorted(['en', *expected_catalogs])):
                  raise SystemExit('Exported language resources differ from the iPhone language declaration or source')
              print('Verified packaged game languages:', ', '.join(sorted(info['CFBundleLocalizations'])))
              if os.environ.get('HL_ADS_ONLY') == '1':
                  match = re.search(r'<script>window\.HL_NATIVE_CONFIG=(.*?)</script>', html)
                  config = json.loads(match.group(1)) if match else {}
                  unit = config.get('REAL_IDS', {}).get('ios', {}).get('interstitial')
                  if (config.get('ADS_ENABLED') is not True or config.get('TEST_MODE') is not False
                          or config.get('DISABLE_GAMEPLAY_TELEMETRY') is not True
                          or unit != os.environ['HL_ADMOB_INTERSTITIAL_ID']
                          or info.get('GADApplicationIdentifier') != os.environ['HL_ADMOB_APP_ID']):
                      raise SystemExit('Exported app does not match its iOS production ad configuration')
                  for page in ('privacy.html', 'support.html', 'terms.html', 'support-languages.js'):
                      with open(os.path.join(os.environ['GITHUB_WORKSPACE'], 'dev', 'app', 'www', page), 'rb') as source:
                          if ipa.read(public + page) != source.read():
                              raise SystemExit('Exported legal page differs from bundled source: ' + page)
                  print('Verified production AdMob app and interstitial, demo mode off, optional gameplay telemetry off, and bundled disclosures')
              manifest_path = names[0].removesuffix('Info.plist') + 'PrivacyInfo.xcprivacy'
              if manifest_path not in ipa.namelist(): raise SystemExit('Exported app is missing PrivacyInfo.xcprivacy')
              manifest = plistlib.loads(ipa.read(manifest_path))
              if not any(entry.get('NSPrivacyAccessedAPIType') == 'NSPrivacyAccessedAPICategoryUserDefaults'
                         and 'CA92.1' in entry.get('NSPrivacyAccessedAPITypeReasons', [])
                         for entry in manifest.get('NSPrivacyAccessedAPITypes', [])):
                  raise SystemExit('Exported privacy manifest is missing the app-local UserDefaults reason CA92.1')
          expected = {'CFBundleIdentifier': 'com.highandlow.game', 'CFBundleShortVersionString': '1.0.' + os.environ['EXPECTED_BUILD'], 'CFBundleVersion': os.environ['EXPECTED_BUILD'], 'UIDeviceFamily': [1]}
          for key, value in expected.items():
              if info.get(key) != value: raise SystemExit(f'Unexpected {key}: {info.get(key)!r}; expected {value!r}')
          print('Verified IPA bundle ID, version, build number, iPhone-only device family, and UserDefaults privacy reason')
          PY
          ditto -x -k "$IPA" "$WORK/unpacked"
          APP="$WORK/unpacked/Payload/App.app"
          test -d "$APP"
          codesign --verify --deep --strict "$APP"
          codesign -dv --verbose=4 "$APP" 2> "$WORK/signature.txt"
          grep -Fq "TeamIdentifier=$TEAM_ID" "$WORK/signature.txt"
          grep -Fq 'Authority=Apple Distribution:' "$WORK/signature.txt"
          mkdir "$WORK/private_keys"
          KEY="$WORK/private_keys/AuthKey_$ASC_KEY_ID.p8"
          KEY="$KEY" python3 -c "import os;p=os.environ['ASC_KEY_P8'];b=''.join(l.strip() for l in p.strip().splitlines() if 'PRIVATE KEY' not in l);open(os.environ['KEY'],'w').write('-----BEGIN PRIVATE KEY-----\\n'+'\\n'.join(b[i:i+64] for i in range(0,len(b),64))+'\\n-----END PRIVATE KEY-----\\n')"
          API_PRIVATE_KEYS_DIR="$WORK/private_keys" xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "::notice::Signed build ${{ github.run_number }} uploaded to App Store Connect"
      - name: Remove the one-off signing certificate and profile
        if: always() && env.HAVE_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 scripts/ios-signing.py cleanup
      - name: Check Apple processing and internal TestFlight status
        if: success() && env.HAVE_ASC == 'true'
        timeout-minutes: 4
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: python3 scripts/ios-signing.py status
