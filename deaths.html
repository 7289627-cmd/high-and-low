<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>High & Low death workshop</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+2:wght@500;600;700;800&display=swap"><style>
/* Layout: one-screen pass-and-play stage. Bean cast on a sky backdrop over a strip of ground, action tray pinned at the bottom. Single committed cartoon look. */
:root{
  --sky:#7FD0E4; --sky-deep:#5BB8D2; --ground:#F4C04F; --ground-dark:#D9A22F;
  --ink:#1E2240; --paper:#FFF8EC; --paper-2:#F1E4CB; --red:#EE4B3B; --green:#2FA36B;
  --yellow:#FFD23F; --muted:#545C7D; --monster:#6CC24A; --white:#FFFFFF;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme: light;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;
  background:linear-gradient(to top,var(--ground) 0 58px,var(--ground-dark) 58px 62px,var(--sky) 62px)}
button{font:inherit;color:inherit}
#app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}

/* Logo */
.logo{font-family:var(--display);color:var(--white);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;letter-spacing:.01em;line-height:1;margin:0;font-weight:400}
.logo span{color:var(--yellow);margin:0 .08em}
.logo.big{font-size:clamp(46px,13vw,68px);text-align:center;text-wrap:balance}
.logo.small{font-size:24px;-webkit-text-stroke:4px var(--ink)}

/* Buttons */
.btn{font-family:var(--display);font-size:18px;letter-spacing:.02em;background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:9px 18px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--red);color:var(--white)}
.btn.go{background:var(--green);color:var(--white)}
.btn.big{font-size:24px;padding:12px 22px}
.btn.sm{font-size:15px;padding:5px 12px;box-shadow:0 3px 0 var(--ink)}
.link{background:none;border:0;padding:0;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}

/* Header */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .logo{margin-right:auto}
.pill{font-weight:800;background:var(--paper);border:3px solid var(--ink);border-radius:99px;padding:1px 12px;font-variant-numeric:tabular-nums}

/* Bean */
.bean{display:block;width:100%;height:auto;overflow:visible}
.bob{animation:bob 1.8s ease-in-out infinite;transform-origin:50% 100%}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.03,.97)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

/* Cast */
.cast{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;align-content:start;padding:30px 3px 8px}
.card{position:relative;display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center;text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:8px 10px;box-shadow:0 4px 0 var(--ink);cursor:default}
.card.pick{cursor:pointer}
.card.pick:hover{transform:translateY(-2px)}
.card.is-turn{background:#FFF0BF}
.card.is-target{outline:4px solid var(--red);outline-offset:2px}
.card.dead{background:var(--paper-2);border-style:dashed;box-shadow:none}
.pic{position:relative;display:block;width:58px}
.info{display:grid;gap:3px;min-width:0}
.nm{font-family:var(--display);font-size:19px;line-height:1.05;display:flex;align-items:center;gap:5px;min-width:0}
.nm b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:.08em;background:var(--ink);color:var(--white);border-radius:5px;padding:0 5px;flex:none}
.tag.up{background:var(--red)}
.hearts{font-size:15px;line-height:1;letter-spacing:1px;color:var(--red)}
.hearts .lost{color:#C9C2B2}
.rng{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.barline{display:block;position:relative;height:9px;background:var(--white);border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.barline i{position:absolute;top:0;bottom:0;background:var(--sky-deep)}
.barline.hot i{background:var(--red)}
.left{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.zone{justify-self:start;font-size:11px;font-weight:800;letter-spacing:.06em;background:var(--ink);color:var(--yellow);border-radius:6px;padding:0 6px}
.rip{font-family:var(--display);font-size:15px;color:var(--red)}
.bubble{position:absolute;bottom:92%;left:-8px;white-space:nowrap;font-family:var(--display);font-size:15px;background:var(--white);border:3px solid var(--ink);border-radius:12px;padding:1px 8px;z-index:2;animation:popIn .3s both}
.bubble.up{background:#C9F2DA}
.bubble.down{background:#FFD9D4}

/* Tray */
.tray{background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:12px 14px 14px;box-shadow:0 5px 0 var(--ink);display:grid;gap:8px}
.turn{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.turn-name{font-family:var(--display);font-size:21px;line-height:1.1}
.msg{font-size:14px;color:var(--muted);font-weight:600}
.q{margin:0;font-weight:700;font-size:17px}
.hint{margin:0;font-weight:700}
.sub{font-size:14px;color:var(--muted);font-weight:600;display:flex;flex-wrap:wrap;gap:4px 12px;font-variant-numeric:tabular-nums}
.ask-row{display:flex;gap:8px}
.ask-row input{flex:1;min-width:0;font-family:var(--display);font-size:24px;border:3px solid var(--ink);border-radius:14px;padding:4px 12px;background:var(--white);color:var(--ink);font-variant-numeric:tabular-nums}
.err{margin:0;color:var(--red);font-weight:700;font-size:14px;min-height:0}
.err:empty{display:none}
.guess-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.g{font-family:var(--display);font-size:17px;background:var(--white);border:3px solid var(--ink);border-radius:12px;padding:8px 2px;box-shadow:0 3px 0 var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.g:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.g:disabled{background:var(--paper-2);color:#A79F8E;text-decoration:line-through;box-shadow:none;cursor:default}

/* Setup */
.setup{flex:1;min-height:0;overflow:auto;display:grid;gap:14px;align-content:start;padding-block:6px 24px}
.hero{display:grid;gap:10px;justify-items:center;text-align:center}
.lineup{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.lineup .lu{width:46px}
.lede{margin:0;max-width:60ch;font-weight:600;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:10px 14px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:12px 14px;display:grid;gap:10px;box-shadow:0 4px 0 var(--ink)}
.panel h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;display:flex;align-items:baseline;gap:8px}
.panel h2 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:700}
.rows{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto 28px;gap:6px;align-items:center}
.prow .dot{width:34px}
.pname{min-width:0;width:100%;font:700 17px var(--body);border:2px solid var(--ink);border-radius:10px;padding:4px 10px;background:var(--white);color:var(--ink)}
.seg{font-weight:700;font-size:13px;border:2px solid var(--ink);background:var(--white);border-radius:10px;padding:4px 8px;cursor:pointer}
.seg.on{background:var(--ink);color:var(--white)}
.x{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--white);font-weight:800;line-height:1;cursor:pointer;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{font-weight:700;font-size:15px;border:2px solid var(--ink);background:var(--white);border-radius:99px;padding:4px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.note{margin:0;font-size:14px;color:var(--muted);font-weight:600}
#startBtn{justify-self:center}

/* Overlay */
#ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(30,34,64,.62);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:16px;display:grid;gap:10px}
.sheet.center{text-align:center;justify-items:center}
.sheet h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.1;text-wrap:balance}
.sheet p{margin:0;font-weight:600;color:var(--muted);max-width:36ch}
.sheet .ask-row{width:100%}
.hero-bean{width:96px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Death stage */
.stage{position:relative;width:100%;height:250px;border-radius:18px;overflow:hidden;background:var(--sky-deep);border:3px solid var(--ink)}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:var(--ground);border-top:3px solid var(--ink);z-index:0}
.actor{position:absolute;bottom:40px;left:50%;width:110px;margin-left:-55px;transform-origin:50% 100%;z-index:2}
.layer-dead{position:absolute;inset:0;opacity:0;animation:appear .01s linear both}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{to{transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes puff{0%{opacity:0;transform:scale(.3)}30%{opacity:.95}100%{opacity:0;transform:translateX(var(--dx,0)) scale(1.7)}}
.puff{position:absolute;bottom:38px;width:48px;height:30px;border-radius:50%;background:var(--white);border:2px solid var(--ink);z-index:3;animation:puff .8s ease-out .9s both}
.puff.big{width:70px;height:44px}

/* anvil */
.anvil{position:absolute;left:50%;width:124px;margin-left:-62px;bottom:64px;z-index:4;transform:translateY(-440px);animation:drop .42s cubic-bezier(.55,0,1,.45) .46s forwards}
.a-squash{animation:squash .12s linear .88s forwards}
@keyframes squash{to{transform:scale(1.6,.18)}}
/* zap */
.cloud{position:absolute;top:6px;left:50%;width:150px;margin-left:-75px;z-index:4;animation:appear .4s ease both}
.bolt{position:absolute;top:56px;left:50%;width:44px;margin-left:-22px;z-index:5;opacity:0;animation:flash .6s linear .55s both}
.flash{position:absolute;inset:0;background:var(--white);z-index:6;opacity:0;animation:flash .6s linear .55s both}
@keyframes flash{0%,20%,40%,100%{opacity:0}10%,30%,55%{opacity:1}}
.a-zap{animation:charr .1s .7s forwards,shake .08s linear .7s 8,crumble .6s ease-in 2.1s forwards}
@keyframes charr{to{filter:brightness(.22) saturate(0)}}
@keyframes crumble{to{transform:scaleY(0);opacity:0}}
.ash{position:absolute;bottom:34px;left:50%;width:96px;height:20px;margin-left:-48px;border-radius:50%;background:#3A3F5C;z-index:1;animation:appear .4s 2.3s both}
/* rocket */
.rig{position:absolute;bottom:40px;left:50%;width:150px;height:150px;margin-left:-75px;z-index:2;animation:shake .07s linear .2s 12,launch 1.2s cubic-bezier(.6,0,1,1) 1.1s forwards}
@keyframes launch{to{transform:translateY(-560px) rotate(-6deg)}}
.rig .rocket{position:absolute;right:4px;bottom:-40px;width:54px;overflow:visible}
.rig .actor{left:0;margin-left:0;bottom:0;width:105px}
.flame{transform-box:fill-box;transform-origin:50% 0;opacity:0;animation:appear .01s linear 1s both,flicker .09s linear 1s infinite alternate}
@keyframes flicker{to{transform:scaleY(1.3)}}
/* chomp */
.jaw{position:absolute;left:-6%;width:112%;height:52%;background:var(--monster);z-index:5}
.jaw.top{top:0;border-bottom:3px solid var(--ink);transform:translateY(calc(-100% - 32px));animation:jawIn .32s ease-in 1.1s forwards,chewT .18s ease-in-out 1.5s 6 alternate}
.jaw.bot{bottom:0;border-top:3px solid var(--ink);transform:translateY(calc(100% + 32px));animation:jawIn .32s ease-in 1.1s forwards,chewB .18s ease-in-out 1.5s 6 alternate}
@keyframes jawIn{to{transform:translateY(0)}}
@keyframes chewT{from{transform:translateY(0)}to{transform:translateY(-16px)}}
@keyframes chewB{from{transform:translateY(0)}to{transform:translateY(16px)}}
.teeth{position:absolute;left:0;width:100%;height:26px}
.jaw.top .teeth{top:100%}
.jaw.bot .teeth{bottom:100%}
.mon-eyes{position:absolute;left:50%;bottom:30px;width:120px;margin-left:-60px}
.a-shiver{animation:shake .08s linear .2s 10}
.burp{position:absolute;top:14px;right:16px;z-index:6;font-family:var(--display);font-size:26px;color:var(--white);-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;animation:popIn .4s 2.7s both}
/* melt */
.sun{position:absolute;top:-46px;right:-46px;width:150px;height:150px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);box-shadow:0 0 0 18px rgba(255,210,63,.35);z-index:1;transform:scale(.3);animation:sunIn 1s ease-out both}
@keyframes sunIn{to{transform:scale(1.15)}}
.puddle{position:absolute;bottom:30px;left:50%;height:22px;width:0;border-radius:50%;border:3px solid var(--ink);transform:translateX(-50%);z-index:1;animation:grow 1.6s ease-in .8s forwards}
@keyframes grow{to{width:230px}}
.a-melt{animation:melt 1.8s ease-in .7s forwards}
@keyframes melt{to{transform:scale(2,.08)}}
/* pop */
.a-pop{transform-origin:50% 60%;animation:inflate 1.25s ease-in .3s forwards,vanish .01s linear 1.55s forwards}
@keyframes inflate{0%{transform:scale(1)}20%{transform:scale(1.15,1.1)}35%{transform:scale(1.1,1.22)}55%{transform:scale(1.35)}75%{transform:scale(1.3,1.5)}100%{transform:scale(1.7)}}
@keyframes vanish{to{opacity:0}}
.bit{position:absolute;left:50%;bottom:112px;width:12px;height:12px;margin-left:-6px;border-radius:3px;border:2px solid var(--ink);z-index:3;animation:burst .9s ease-out 1.55s both}
@keyframes burst{0%{opacity:0;transform:translate(0,0)}1%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.pow{position:absolute;top:28%;left:0;right:0;text-align:center;z-index:6;font-family:var(--display);font-size:58px;color:var(--white);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;animation:popIn .4s 1.55s both}
/* bonk */
.pot{position:absolute;left:50%;width:56px;margin-left:-28px;bottom:158px;z-index:4;transform:translateY(-320px);animation:drop .38s cubic-bezier(.55,0,1,.45) .4s forwards,potOff .7s ease-in 1s forwards}
@keyframes potOff{from{transform:translateY(0)}to{transform:translate(110px,170px) rotate(160deg);opacity:0}}
.a-bonk{animation:bonk .35s ease-out .78s}
@keyframes bonk{40%{transform:scale(1.12,.82)}100%{transform:scale(1)}}
.stars{position:absolute;bottom:178px;left:50%;width:90px;margin-left:-45px;text-align:center;z-index:4;color:var(--yellow);font-size:24px;-webkit-text-stroke:1.5px var(--ink);animation:appear .2s .85s both,spin 1s linear .85s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* win */
.a-dance{animation:dance .5s ease-in-out infinite alternate}
@keyframes dance{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-26px) rotate(6deg)}}
.fall{position:absolute;top:-20px;width:10px;height:14px;border:2px solid var(--ink);border-radius:2px;z-index:1;animation:fall 2.4s linear infinite both}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(290px) rotate(540deg)}}

@media (prefers-reduced-motion:reduce){
  .bob,.eyes,.a-dance,.fall,.stars{animation:none!important}
}
@media (max-width:380px){.prow{grid-template-columns:30px minmax(0,1fr) auto auto 26px}.seg{padding:3px 6px}}

/* v2: multiplayer rooms, mobile-first */
.scroll{flex:1;min-height:0;overflow:auto;display:grid;gap:12px;align-content:start;padding:4px 3px 20px}
.center{text-align:center;justify-items:center}
.code-label{font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.code{font-family:var(--display);font-size:clamp(52px,17vw,72px);letter-spacing:.14em;line-height:1;color:var(--ink);padding-left:.14em}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;letter-spacing:.04em}
.status i{width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--ink)}
.status.off i{background:var(--red)}
.status.solo i{background:var(--yellow)}
.plist{display:grid;gap:8px}
.prow2{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center}
.prow2 .who{font-family:var(--display);font-size:19px;display:flex;align-items:center;gap:6px;min-width:0}
.prow2 .who b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state-ok{font-weight:800;font-size:13px;color:var(--green)}
.state-wait{font-weight:800;font-size:13px;color:var(--muted)}
.home-actions{display:grid;gap:10px}
.field{display:grid;gap:4px}
.field label{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input{font:700 20px var(--body);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;background:var(--white);color:var(--ink);min-width:0;width:100%}
.join-row{display:flex;gap:8px}
.join-row input{flex:1;min-width:0;font-family:var(--display);font-size:26px;letter-spacing:.2em;text-transform:uppercase;border:3px solid var(--ink);border-radius:14px;padding:4px 12px;background:var(--white);color:var(--ink)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;font-size:13px;letter-spacing:.1em}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--paper-2)}
.dirtog{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dirtog button{font-family:var(--display);font-size:20px;border:3px solid var(--ink);border-radius:14px;background:var(--white);padding:7px 6px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.dirtog button[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.dirtog svg{width:16px;height:16px}
.card.mine{background:#E6F6FB}
.reveal{font-size:13px}
.secret-big{font-family:var(--display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.ready-list{display:grid;gap:6px;width:100%}
.big-bean{width:110px}
.tip{font-size:14px;color:var(--muted);font-weight:600;margin:0}
.warn{background:#FFE7E3;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;font-weight:600;font-size:14px}
.btn.full{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* v3: split-screen ask + number pad */
.askv{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.ask-top{display:flex;align-items:center;gap:10px}
.ask-who{display:flex;align-items:center;gap:8px;min-width:0;margin-left:auto;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:3px 10px 3px 4px}
.ask-who .mini{width:30px;flex:none}
.ask-who b{display:block;font-family:var(--display);font-weight:400;font-size:16px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ask-who span{display:block;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.split{flex:1;min-height:0;position:relative;display:grid;grid-template-rows:1fr 1fr;gap:12px;padding-bottom:6px}
.half{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);cursor:pointer;padding:18px 12px;overflow:hidden;transition:transform .08s,box-shadow .08s}
.half:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.half.hi{background:var(--green);justify-content:flex-start}
.half.lo{background:var(--red);justify-content:flex-end}
.half::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.08) 0 14px,transparent 14px 28px);pointer-events:none}
.half .arrow{width:clamp(56px,16vw,84px);height:auto;animation:nudgeUp 1.1s ease-in-out infinite}
.half.lo .arrow{animation-name:nudgeDn}
@keyframes nudgeUp{50%{transform:translateY(-8px)}}
@keyframes nudgeDn{50%{transform:translateY(8px)}}
.half .word{font-family:var(--display);font-size:clamp(38px,12vw,56px);color:var(--white);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;letter-spacing:.04em;line-height:1}
.speaker{position:absolute;left:50%;top:calc(50% - 3px);transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;pointer-events:none;z-index:2}
.spk-bean{display:block;width:70px;flex:none}
.speech{position:relative;background:var(--white);border:3px solid var(--ink);border-radius:18px;padding:6px 14px;font-family:var(--display);font-size:24px;line-height:1.15;box-shadow:0 4px 0 var(--ink);white-space:nowrap}
.speech::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:12px solid var(--ink);border-left:0}
.speech::after{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-right:9px solid var(--white);border-left:0}
.say{display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;align-items:center;padding-top:6px}
.say .spk-bean{width:80px}
.speech.big{white-space:normal;font-size:clamp(22px,7vw,30px);display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:10px 14px}
.dirword{font-family:var(--display);font-size:inherit;color:var(--white);border:3px solid var(--ink);border-radius:12px;padding:0 10px;cursor:pointer;line-height:1.2;box-shadow:0 3px 0 var(--ink);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.dirword.hi{background:var(--green)}
.dirword.lo{background:var(--red)}
.numslot{display:inline-block;min-width:3.2ch;font-variant-numeric:tabular-nums;color:var(--red);border-bottom:3px dashed var(--ink);text-align:center}
.ask-hint{justify-content:space-between}
.jit{display:inline-block;animation:jit .28s linear infinite}
.jit-slow{animation:jit .5s linear infinite}
@keyframes jit{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-1px,1px) rotate(-2.5deg)}50%{transform:translate(1px,-1px) rotate(2deg)}75%{transform:translate(-1px,0) rotate(-1.5deg)}100%{transform:translate(1px,1px) rotate(1deg)}}
.blink{animation:blink2 1s steps(1) infinite}
@keyframes blink2{50%{opacity:.25}}
.land{animation:land .55s cubic-bezier(.3,1.4,.5,1) both}
@keyframes land{0%{transform:translateY(-140px) scale(1.5) rotate(-8deg);opacity:0}55%{transform:translateY(6px) scale(1.08,.8);opacity:1}78%{transform:translateY(-4px) scale(.97,1.05)}100%{transform:none}}
.speech.pop{animation:popIn .3s both}
.yap{transform-box:fill-box;transform-origin:center;animation:yap .22s ease-in-out infinite alternate}
@keyframes yap{to{transform:scaleY(.35)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:auto}
.pad.rise{animation:rise .35s ease-out both}
@keyframes rise{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
.key{font-family:var(--display);font-size:28px;height:56px;background:var(--white);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .05s,box-shadow .05s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);background:var(--paper)}
.key.del{background:var(--paper-2)}
.key.mid{background:var(--yellow);font-size:20px;letter-spacing:.06em}
.secret-big.entry{font-size:48px;color:var(--red);min-height:52px}
@media (max-height:640px){.key{height:48px;font-size:24px}.say .spk-bean{width:64px}.say{grid-template-columns:64px minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.jit,.jit-slow,.yap,.blink,.half .arrow{animation:none!important}.land,.pad.rise,.speech.pop{animation-duration:.01ms!important}}
#ov[hidden]{display:none}
.askv .say{flex:1;min-height:0;grid-template-columns:clamp(80px,26vw,120px) minmax(0,1fr)}
.askv .say .spk-bean{width:clamp(80px,26vw,120px)}
.askv .pad{margin-top:0}
@media (max-height:640px){.askv .say{grid-template-columns:64px minmax(0,1fr)}.askv .say .spk-bean{width:64px}}

/* v4: digit slots + first-player wheel */
.slots{display:inline-flex;align-items:flex-end;gap:3px;font-variant-numeric:tabular-nums}
.slot{display:inline-block;min-width:.72em;text-align:center;border-bottom:3px solid var(--ink);color:var(--red);line-height:1.1}
.slot.e{border-bottom-color:rgba(30,34,64,.35)}
.sep{font-style:normal;color:var(--ink);margin:0 -1px}
.sep.e{opacity:.3}
.numslot{border-bottom:0;min-width:0}
.speech .slots{font-size:.92em}
.secret-big.entry .slots{gap:5px}
.qcount{font-family:var(--display);font-size:17px;background:var(--ink);color:var(--yellow);border-radius:12px;padding:4px 12px}
.wheel-wrap{position:relative;width:min(290px,76vw);aspect-ratio:1;margin-top:12px}
.wheel{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.62,.1,1)}
.wheel svg{display:block;width:100%;height:100%;overflow:visible}
.pointer{position:absolute;top:-20px;left:50%;width:36px;margin-left:-18px;z-index:2;filter:drop-shadow(0 3px 0 var(--ink))}
.wheel-msg{font-weight:800;color:var(--muted)}
.wheel-msg.win{font-family:var(--display);font-weight:400;font-size:28px;color:var(--ink);animation:popIn .4s both}

.speech.big .numslot{flex-basis:100%;display:flex;align-items:flex-end;gap:6px;font-size:1.25em;line-height:1}
.speech.big .numslot .slots{font-size:1em;gap:4px}
.speech.big .numslot .qm{color:var(--ink)}
.card{grid-template-columns:44px minmax(0,1fr);gap:8px;padding:8px}
.pic{width:44px}
.rng{font-size:13px;white-space:nowrap}
.nm{font-size:17px}

.conn-banner{background:var(--yellow);border:3px solid var(--ink);border-radius:12px;font-weight:800;font-size:14px;text-align:center;padding:6px;margin:6px 12px 0}
.hint-pop{display:block;background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-family:var(--display);font-size:17px;color:var(--ink);box-shadow:0 3px 0 var(--ink);text-align:center;animation:hintBob 1.2s ease-in-out infinite}
@keyframes hintBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.timer-pill{display:inline-block;font-family:var(--display);font-size:16px;line-height:1;background:var(--ink);color:var(--yellow);border-radius:12px;padding:4px 10px;margin-left:8px;vertical-align:middle}
.timer-pill.low{background:var(--red);color:var(--white);animation:timerPulse .6s ease-in-out infinite}
@keyframes timerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){.hint-pop,.timer-pill.low{animation:none}}

/* QR join */
.qr{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px;box-shadow:0 4px 0 var(--ink);width:min(190px,60vw)}
.qr img{display:block;width:100%;height:auto;image-rendering:pixelated}

/* sound: mute button */
.mute-btn{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--white);color:var(--ink);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);cursor:pointer}
.mute-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.hero{position:relative}
.hero .mute-btn{position:absolute;top:0;right:0}
/* Worker A: extra death scenes */
/* piano */
.d2-piano{position:absolute;left:50%;width:150px;margin-left:-75px;bottom:64px;z-index:4;transform:translateY(-440px);animation:drop .42s cubic-bezier(.55,0,1,.45) .46s forwards}
.d2-key{position:absolute;left:50%;bottom:70px;width:14px;margin-left:-7px;z-index:5;opacity:0;animation:d2key .9s ease-out .9s both}
@keyframes d2key{0%{opacity:0;transform:translate(0,0) rotate(0)}1%{opacity:1}45%{opacity:1;transform:translate(calc(var(--dx)*.6),-80px) rotate(calc(var(--r)*.5))}100%{opacity:1;transform:translate(var(--dx),-6px) rotate(var(--r))}}
/* banana */
.d2-peel{position:absolute;left:50%;bottom:36px;width:70px;margin-left:-35px;z-index:1;animation:d2peelIn .6s ease-out both}
@keyframes d2peelIn{from{transform:translateX(170px) rotate(25deg);opacity:0}25%{opacity:1}to{transform:translateX(0) rotate(0)}}
.d2-slip{transform-origin:50% 50%;animation:d2slip 2s cubic-bezier(.4,0,.8,.7) forwards}
@keyframes d2slip{0%{transform:translateX(-95px)}34%{transform:translateX(0)}44%{transform:translate(8px,-6px) rotate(-18deg)}60%{transform:translate(22px,-70px) rotate(-130deg)}72%{transform:translate(30px,-30px) rotate(-180deg)}100%{transform:translate(30px,250px) rotate(-180deg)}}
.d2-cover{position:absolute;left:0;right:0;bottom:0;height:40px;background:var(--ground);border-top:3px solid var(--ink);z-index:3}
.d2-hole{position:absolute;left:calc(50% + 6px);bottom:30px;width:96px;height:18px;margin-left:-20px;border-radius:50%;background:var(--ink);z-index:3;transform:scale(0);animation:d2hole .35s ease-out 1.15s forwards}
.d2-hole.top{bottom:30px}
@keyframes d2hole{to{transform:scale(1)}}
/* bees */
.d2-puffbean{animation:d2bean 2.7s ease-in-out both}
@keyframes d2bean{
0%,6%{transform:translate(0,0)}
10%{transform:translate(-4px,0)}14%{transform:translate(4px,0)}18%{transform:translate(-4px,1px)}22%{transform:translate(4px,0)}26%{transform:translate(-4px,0)}30%{transform:translate(4px,1px)}34%{transform:translate(-4px,0)}38%{transform:translate(4px,0)}42%{transform:translate(-3px,0)}46%{transform:translate(0,0) scale(1)}
62%,70%{transform:translate(0,0) scale(1.3,1.25)}
100%{transform:translate(10px,-440px) scale(1.3,1.25) rotate(10deg)}}
.d2-welts{pointer-events:none;z-index:3;opacity:0;animation:d2bean 2.7s ease-in-out both,appear .3s linear 1.15s both}
.d2-swarm{position:absolute;left:50%;bottom:117px;width:0;height:0;z-index:4;animation:d2swarm 2.7s ease-in-out both}
@keyframes d2swarm{0%,70%{transform:translateY(0)}100%{transform:translateY(-440px)}}
.d2-orb{position:absolute;left:0;top:0;width:0;height:0;transform:rotate(var(--a));animation:d2orbit var(--t) linear infinite}
@keyframes d2orbit{from{transform:rotate(var(--a))}to{transform:rotate(calc(var(--a) + 360deg))}}
.d2-bee{position:absolute;left:0;top:0;width:28px;margin:-11px 0 0 -14px;transform:translateX(var(--r));animation:d2bz .16s ease-in-out infinite alternate}
@keyframes d2bz{from{margin-top:-14px}to{margin-top:-8px}}
/* calc */
.d2-calc{position:absolute;left:50%;width:124px;margin-left:-62px;bottom:64px;z-index:4;transform:translateY(-460px);animation:drop .42s cubic-bezier(.55,0,1,.45) .46s forwards,d2cshake .1s linear .92s 4}
.d2-calc svg{display:block;width:100%;height:auto}
.d2-calc .d2-err{opacity:0;animation:appear .01s linear .9s forwards}
.d2-calc .d2-num{animation:vanish .01s linear .9s forwards}
@keyframes d2cshake{0%,100%{margin-left:-62px}25%{margin-left:-65px}75%{margin-left:-59px}}


/* final showdown */
body.showdown{background:linear-gradient(to top,#0E1128 0 58px,#080A1C 58px 62px,transparent 62px),linear-gradient(to bottom,#22284A,#121530)}
body.showdown::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 38% 70% at 50% 40%,rgba(255,255,255,.22),rgba(255,255,255,.07) 55%,transparent 75%);
  animation:d2sweep 4s ease-in-out infinite alternate}
@keyframes d2sweep{from{transform:translateX(-32%)}to{transform:translateX(32%)}}
body.showdown #app{position:relative;z-index:1}
body.showdown .card.dead{opacity:.25;transform:scale(.92)}
body.showdown .card:not(.dead){border-color:#FFD23F;border-width:4px;transform:scale(1.04);box-shadow:0 0 22px 6px rgba(255,255,255,.55),0 0 60px 14px rgba(255,255,255,.18),0 4px 0 var(--ink)}
body.showdown .cast::before{content:"FINAL SHOWDOWN";grid-column:1/-1;text-align:center;font-family:var(--display);font-size:30px;line-height:1.1;color:var(--yellow);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;animation:d2pulse 1.4s ease-in-out infinite alternate}
@keyframes d2pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){
  body.showdown::after,body.showdown .cast::before{animation:none}
}

@keyframes x3off{to{opacity:0}}

@keyframes x3flk{from{transform:scaleY(.8)}to{transform:scaleY(1.3)}}

.x3-fu{position:absolute;inset:0;background:#B8895A;border:1.5px solid var(--ink);border-radius:4px}

/* ---- finishing pass ---- */
.x4-key{position:absolute;left:50%;bottom:74px;width:14px;margin-left:-7px;z-index:5;opacity:0;animation:x4key .75s linear both}
@keyframes x4key{0%{opacity:1;transform:translate(0,0) rotate(0);animation-timing-function:cubic-bezier(.2,.7,.5,1)}45%{opacity:1;transform:translate(calc(var(--dx)*.62),-64px) rotate(calc(var(--r)*.55));animation-timing-function:cubic-bezier(.5,0,.9,.5)}86%{opacity:1;transform:translate(var(--dx),28px) rotate(var(--r))}93%{opacity:1;transform:translate(var(--dx),22px) rotate(var(--r))}100%{opacity:1;transform:translate(var(--dx),28px) rotate(var(--r))}}
.x4-flag{position:absolute;left:calc(50% - 132px);bottom:38px;width:66px;z-index:3;transform-origin:90% 100%;opacity:0}
.x4-flag svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:86% 94%}
@keyframes x4flagup{0%{opacity:0;transform:translateY(30px) scale(.4)}100%{opacity:1;transform:none}}
@keyframes x4wave{from{transform:rotate(-13deg)}to{transform:rotate(11deg)}}
/* Worker B: bean picker, taunts, awards, hats */

.lpic{position:relative;display:block}
.prow2 .btn.sm{white-space:nowrap}
.picker{display:grid;gap:10px;background:var(--paper-2);border:3px solid var(--ink);border-radius:16px;padding:10px;margin-top:4px}
.pk-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pk-sw,.pk-hat{position:relative;font:inherit;color:var(--ink);background:var(--white);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:4px;cursor:pointer;display:grid;justify-items:center;gap:2px;min-width:0}
.pk-sw svg{width:100%;max-width:38px;height:auto;aspect-ratio:100/140}
.pk-sw:disabled{opacity:.35;cursor:not-allowed}
.pk-sw.sel,.pk-hat.sel{outline:4px solid var(--ink);outline-offset:2px}
.pk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk-hat{padding:6px 4px}
.pk-hat .hb svg{width:44px;height:auto;aspect-ratio:100/140;display:block}
.pk-hat .hn{font-family:var(--display);font-size:14px;line-height:1.1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pk-hat.locked{background:var(--paper);cursor:not-allowed}
.pk-hat.locked .hb{opacity:.45;filter:grayscale(.6)}
.pk-hat .lockb{position:absolute;top:4px;right:4px;background:var(--yellow);border:2px solid var(--ink);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;z-index:1}
.taunt-bar{display:flex;justify-content:center;gap:8px;margin-top:2px}
.taunt-wrap{display:flex;justify-content:center}
.taunt-btn{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--white);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:20px;line-height:1;padding:0;cursor:pointer;display:grid;place-items:center}
.taunt-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.taunt-btn:disabled{opacity:.45;cursor:default}
.taunt-pop{position:absolute;left:50%;top:-6px;margin-left:-14px;font-size:26px;line-height:1;pointer-events:none;z-index:5;animation:tauntfloat 1.6s ease-out both}
@keyframes tauntfloat{0%{transform:translateY(0) scale(.6);opacity:0}12%{transform:translateY(-5px) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translateY(-40px) scale(1);opacity:0}}
.wins-pill{justify-self:center;margin:8px auto 0;display:inline-block;font-family:var(--display);font-size:15px;background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:2px 12px;box-shadow:0 3px 0 var(--ink)}
.newhat{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0;padding:8px 12px;background:var(--yellow);border:3px solid var(--ink);border-radius:16px;font-family:var(--display);font-weight:400}
.newhat .nh-bean svg{width:44px;height:auto;display:block}
.awards{display:grid;gap:6px;margin:10px 0;text-align:left}
.award{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--paper-2);border:3px solid var(--ink);border-radius:14px;padding:4px 8px}
.award .aw-bean svg{width:30px;height:auto;display:block}
.award .aw-txt{display:grid;min-width:0}
.award .aw-txt b{font-family:var(--display);font-weight:400;font-size:16px}
.award .aw-txt span{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.award .aw-stat{font-size:12px;text-align:right;max-width:110px}

/* Smart slots, range ruler, left counts */
.slot.fixed{color:var(--muted);border-bottom-color:var(--muted)}
.ruler{margin:8px 0 4px;display:grid;gap:4px}
.rl-ends{display:flex;justify-content:space-between;font-family:var(--display);font-size:18px;line-height:1}
.rl-bar{display:flex;height:22px;background:var(--white);border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.rl-bar i{display:block;height:100%;min-width:0;overflow:hidden;position:relative}
.rl-bar i.plain{background:var(--sky-deep)}
.rl-bar i.yes{background:var(--green)}
.rl-bar i.no{background:var(--red)}
.rl-bar i+i{border-left:3px solid var(--ink)}
.rl-bar i em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:13px;line-height:1;color:var(--white);white-space:nowrap}
.rl-txt{margin:0;text-align:center;font-size:14px;color:var(--ink)}
.rng b{font-weight:900}
.left b{color:var(--ink)}
.left-line{margin:2px 0 4px;font-size:15px;text-align:center}
.askv .ruler{flex:none}
.askv .say{min-height:132px}
.askv .ask-hint{display:none}

/* Coins and powers */
.coin-pill{display:inline-flex;align-items:center;gap:3px;flex:none;font-family:var(--display);font-weight:400;font-size:13px;line-height:1;background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:1px 7px 1px 3px;color:var(--ink)}
.coin-pill b{font-weight:400}
.coin-pill svg{display:block;flex:none}
.pw-ic-sm{flex:none;font-size:15px;line-height:1}
.pw-par{flex:none;font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:.06em;line-height:1.4;border:2px solid var(--ink);border-radius:6px;padding:0 4px;background:var(--sky)}
.pw-par.even{background:var(--yellow)}
.pw-bits{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:2px 0}
.pw-btn{background:var(--yellow);flex:none;white-space:nowrap}
.pw-row{display:flex;justify-content:flex-end}
.pw-row:empty{display:none}
.ask-top{flex-wrap:wrap}
.pw-sheet{text-align:left;gap:10px}
.pw-sheet h2{text-align:center}
.pw-have{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px}
.pw-list{display:grid;gap:8px}
.pw-card{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--white);border:3px solid var(--ink);border-radius:16px;padding:6px 8px}
.pw-card.off{background:var(--paper-2)}
.pw-card.off .pw-ic{opacity:.5}
.pw-ic{font-size:28px;line-height:1;text-align:center}
.pw-tx{display:grid;gap:1px;min-width:0}
.pw-nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pw-nm b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.1}
.pw-cost{display:inline-flex;align-items:center;gap:2px;font-family:var(--display);font-size:14px}
.pw-ds{font-size:13px;font-weight:600;color:var(--ink);line-height:1.2}
.pw-why{font-style:normal;font-size:12px;font-weight:800;color:var(--red);line-height:1.2}
.pw-targets{display:grid;gap:8px}
.pw-tg{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:20px;color:var(--ink);background:var(--white);border:3px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding:6px 12px;cursor:pointer;text-align:left}
.pw-tg .mini{width:34px;flex:none}
.pw-tg b{font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-stage{min-height:150px}
.pw-stage.stage{height:200px}
.coins-home{display:flex;align-items:center;justify-content:center;gap:5px;width:fit-content;margin-top:6px}

/* Card fit on phones: let the range wrap, keep every line inside the card */
.cast{grid-auto-rows:max-content}
.card{min-width:0;overflow:hidden}
.card .info>*{min-width:0;max-width:100%}
.rng{white-space:normal;line-height:1.2;overflow-wrap:anywhere}
.zone{white-space:normal;max-width:100%}
.card .barline{width:100%}
@media (max-width:420px){.cast{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:7px}.card .nm{font-size:16px}}

/* Keep every screen inside the phone's width (wide children were stretching the page) */
.scroll{grid-template-columns:minmax(0,1fr)}
.scroll>*{min-width:0}
.join-row input,.field input{min-width:0;width:100%}

/* Private knowledge: danger meter on my card */
.dg-dots{display:inline-flex;align-items:center;gap:5px;padding:3px 0}
.dg-dots i{display:block;width:10px;height:10px;box-sizing:border-box;border:2px solid var(--ink);border-radius:50%;background:transparent}
.dg-dots i.on{background:var(--red)}
@keyframes dgshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
.card.mine.dg3{animation:dgshake .5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.card.mine.dg3{animation:none}}

/* Ask everyone: row of beans in the ask top bar */
.ask-row{display:flex;align-items:center;gap:6px;margin-left:auto;min-width:0;flex:0 1 auto;flex-wrap:nowrap}
.ar{display:flex;align-items:center;gap:6px;flex:none}
.ar .ar-b{display:block;width:24px;flex:none}
.ar .ar-b svg{display:block;width:100%;height:auto}
.ar.f{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:2px 10px 2px 5px}
.ar.f .ar-b{width:32px}
.ar-r{font-family:var(--display);font-size:14px;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.ask-top .qcount{flex:none}
.rip{display:inline-flex;align-items:center;gap:4px}
.rip .dicon{display:inline-flex;width:24px;height:24px;font-size:20px;line-height:24px;align-items:center;justify-content:center;flex:none}
.rip .dicon svg{width:24px;height:24px;display:block}
.card .bubble{bottom:auto;top:-4px;left:-4px;font-size:14px;padding:0 7px}

/* App feel: no pull-to-refresh, no double-tap zoom, no long-press selection on game screens */
html,body{overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,.invite-url{-webkit-user-select:text;user-select:text}
button{touch-action:manipulation}

/* Worker C: Play button, friends block, waiting view */
.btn.primary.big#playBtn{min-height:76px;font-size:34px;border-radius:20px;padding:10px 22px}
#friendsBtn{min-height:48px}
.friends{display:grid;gap:10px}
.friends.closed{display:none}
.hero .info-btn{position:absolute;top:0;left:0;width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:var(--white);color:var(--ink);border:3px solid var(--ink);border-radius:50%;box-shadow:0 3px 0 var(--ink);cursor:pointer;font-family:var(--display);font-size:22px;line-height:1}
.hero .info-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.waitv{justify-items:center;align-content:start;gap:14px;padding-top:14px}
.waitv .panel{width:100%}
.finding{margin:0;font-family:var(--display);font-size:24px;color:var(--ink)}
.dots i{font-style:normal;display:inline-block;animation:dotb 1.2s infinite both}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes dotb{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
@media (max-width:360px){.hero .logo.big{font-size:36px;-webkit-text-stroke:4px var(--ink)}.hero .lineup .lu{width:40px}.hero .lineup{gap:4px}.btn.primary.big#playBtn{font-size:32px}}

/* ---- clearer bars ---- */
.ruler{margin:10px 0 6px;gap:6px}
.rl-bar{height:40px;border-radius:14px;box-shadow:0 4px 0 var(--ink)}
.rl-bar i{transition:flex .18s ease}
.rl-bar i em{font-size:19px;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.rl-bar i.plain em{font-size:17px;letter-spacing:0}
.rl-caps{display:flex;justify-content:space-between;gap:8px}
.rl-caps span{font-family:var(--display);font-size:17px;line-height:1;padding:5px 9px;border:3px solid var(--ink);border-radius:10px;background:var(--white);font-variant-numeric:tabular-nums;white-space:nowrap}
.rl-caps span.yes{box-shadow:inset 0 -5px 0 var(--green)}
.rl-caps span.no{box-shadow:inset 0 -5px 0 var(--red)}
.hp{display:block;position:relative;width:100%;height:16px;background:var(--paper-2);border:3px solid var(--ink);border-radius:99px}
.hp i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--green)}
.hp.mid i{background:var(--yellow)}
.hp.low i,.hp.hot i{background:var(--red)}
.hp.hot i{animation:hppulse .7s ease-in-out infinite alternate}
.hp u{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--white);animation:hpghost 1.5s ease-out both}
.hp .dmg{position:absolute;right:0;top:20px;font-family:var(--display);font-size:15px;line-height:1;color:var(--red);-webkit-text-stroke:3px var(--white);paint-order:stroke fill;white-space:nowrap;pointer-events:none;animation:hpdmg 1.5s ease-out both;z-index:2}
@keyframes hpdrain{from{width:var(--from)}}
@keyframes hpghost{0%,45%{opacity:1}100%{opacity:0}}
@keyframes hpdmg{0%{transform:scale(.5);opacity:0}15%{transform:scale(1.25);opacity:1}30%,75%{transform:scale(1);opacity:1}100%{transform:translateY(-6px);opacity:0}}
@keyframes hppulse{from{opacity:1}to{opacity:.55}}
.card .rng{font-size:15px}
@media (prefers-reduced-motion:reduce){.hp i,.hp u,.hp .dmg{animation:none!important}.hp u,.hp .dmg{display:none}}

/* ---- desktop ---- */
@media (min-width:820px){
  #app{max-width:520px}
  #ov .sheet{max-width:480px;margin-left:auto;margin-right:auto}
}
@media (hover:hover) and (pointer:fine){
  .btn:hover,.key:hover,.half:hover{filter:brightness(1.06)}
  .btn,.key,.half,.card[data-pid]{cursor:pointer}
}

.legal{font-size:14px}.legal a{color:var(--ink);font-weight:700}

/* ---- duel ---- */
.elo{font-family:var(--body);font-weight:800;font-size:12px;background:var(--ink);color:var(--white);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:middle;font-variant-numeric:tabular-nums}
.elo-pill b{font-family:var(--display);font-weight:400;font-size:18px;margin-right:4px}
.elo-res{display:flex;align-items:baseline;justify-content:center;gap:10px;margin:6px 0 2px;font-family:var(--display)}
.elo-res .d{font-size:30px;line-height:1}.elo-res.up .d{color:var(--green)}.elo-res.down .d{color:var(--red)}
.elo-res b{font-size:22px;font-weight:400}.elo-res span:last-child{font-family:var(--body);font-weight:800;font-size:14px}
.elo-rankup{font-family:var(--display);font-size:20px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:12px;padding:4px 12px;display:inline-block;margin:4px 0}
.cast.duel{grid-template-columns:minmax(0,1fr)!important;gap:6px;padding-top:34px;align-content:center}
.cast.duel .vs{justify-self:center;font-family:var(--display);font-size:26px;color:var(--white);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;line-height:1}
.cast.duel .card{grid-template-columns:104px minmax(0,1fr);gap:14px;padding:14px 16px;border-radius:22px;overflow:visible}
.cast.duel .card .pic{width:104px}
.cast.duel .card .nm{font-size:22px}
.cast.duel .card .rng{font-size:24px}
.cast.duel .card .hp{height:22px}
.cast.duel .card .left b,.cast.duel .card .zone{font-size:16px}
.cast.duel .card.mine{grid-template-columns:64px minmax(0,1fr);padding:10px 14px}
.cast.duel .card.mine .pic{width:64px}
.cast.duel .card.mine .nm{font-size:18px}
.cast.duel .card .bubble{font-size:18px;padding:2px 10px}
.guessv{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:auto;padding:2px 3px 10px}
.ped{display:flex;flex-direction:column;align-items:center;margin-top:auto}
.ped-bean{width:min(38vw,150px);position:relative;z-index:1;margin-bottom:-10px}
.ped-bean svg{width:100%;height:auto;display:block;overflow:visible}
.ped-base{width:min(62vw,240px);background:var(--paper);border:4px solid var(--ink);border-radius:16px 16px 6px 6px;box-shadow:0 6px 0 var(--ink);text-align:center;padding:14px 8px 8px;position:relative}
.ped-base:before{content:"";position:absolute;left:-10px;right:-10px;top:-8px;height:14px;background:var(--yellow);border:4px solid var(--ink);border-radius:10px}
.ped-base b{font-family:var(--display);font-weight:400;font-size:22px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ped-q{font-family:var(--display);font-size:26px;text-align:center;margin:14px 0 2px;color:var(--white);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
.guess-grid.big{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:auto}
.guess-grid.big.n1,.guess-grid.big.n2,.guess-grid.big.n3,.guess-grid.big.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.guess-grid.big.n5,.guess-grid.big.n6{grid-template-columns:repeat(3,minmax(0,1fr))}
.guess-grid.big .g{min-height:64px;font-family:var(--display);font-size:clamp(17px,5.2vw,26px);padding:4px 2px;border:3px solid var(--ink);border-radius:14px;background:var(--white);box-shadow:0 4px 0 var(--ink);color:var(--ink)}
.guess-grid.big .g:disabled{opacity:.35;text-decoration:line-through;box-shadow:none;transform:translateY(4px)}
.guess-grid.big .g:active{transform:translateY(4px);box-shadow:none}

/* ---- slider ---- */
.sld{touch-action:none;user-select:none;-webkit-user-select:none;padding:14px 0 2px;cursor:pointer;outline:none}
.sld-track{position:relative;display:flex;height:58px;border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);background:var(--paper-2)}
.sld-track i{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;font-style:normal}
.sld-track i:first-child{border-radius:13px 0 0 13px}.sld-track i:nth-child(2){border-radius:0 13px 13px 0}
.sld-track i.yes{background:var(--green)}.sld-track i.no{background:var(--red)}
.sld-track i em{font-family:var(--display);font-style:normal;font-size:22px;color:var(--white);letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.sld-track i.tiny em{display:none}
.sld-thumb{position:absolute;top:-14px;bottom:-14px;width:30px;margin-left:-15px;background:var(--white);border:4px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);pointer-events:none}
.sld-thumb:after{content:"";position:absolute;left:50%;top:22%;bottom:22%;width:4px;margin-left:-2px;border-radius:2px;background:var(--ink);opacity:.35}
.sld.drag .sld-thumb{background:var(--yellow);transform:scale(1.08)}
.sld .rl-caps{margin-top:16px}
.bignum{font-family:var(--display);font-size:clamp(40px,13vw,58px);line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.speech.big .numslot{align-items:baseline}
.speech.big .numslot .qm{font-size:1.3em}
.nudge{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;margin-top:auto}
.nudge .key{height:56px}.nudge .key.nb{font-size:34px;line-height:1}
.lob-join{margin-top:12px}
.lob-join input{min-width:0}

/* ---- secret number slider ---- */
.secpick{gap:8px}
.secpick .secret-big.entry{font-size:clamp(48px,16vw,68px);min-height:0}
.sld.one .sld-track i.pick{flex:none;background:var(--yellow);border-radius:13px 0 0 13px}
.sld-ends{display:flex;justify-content:space-between;margin-top:16px;font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums;opacity:.75}
.secpick .nudge{margin-top:4px}
.secpick .nudge .key.mid{font-size:18px}

.secpick .sld,.secpick .nudge{width:100%;justify-self:stretch}
.stake{font-size:18px;margin:6px 0 14px}.stake b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--red)}

/* ---- play modes ---- */
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:2px 0 10px}
.mode{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;background:var(--white);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);color:var(--ink);font-family:var(--display);cursor:pointer;opacity:.72}
.mode svg{width:40px;height:40px;display:block}
.mode b{font-weight:400;font-size:clamp(13px,3.9vw,16px);white-space:nowrap;font-variant-numeric:tabular-nums}
.mode em{position:absolute;top:-9px;right:-5px;font-style:normal;font-size:13px;background:var(--red);color:var(--white);border:3px solid var(--ink);border-radius:99px;padding:1px 7px;line-height:1.2}
.mode[aria-checked="true"]{opacity:1;background:var(--yellow);transform:translateY(-3px);box-shadow:0 7px 0 var(--ink)}
.mode:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}

/* ---- cartoon turn clock ---- */
.tclock{position:relative;display:inline-block;width:56px;height:56px;flex:none;vertical-align:middle;transform-origin:50% 90%;animation:clockSway 3.6s ease-in-out infinite}
.tclock .face{position:absolute;inset:0;border-radius:50%;border:4px solid var(--ink);background:conic-gradient(var(--yellow) calc(var(--f)*1turn),var(--white) 0);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;transition:background .3s}
.tclock .face:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:42%;margin-left:-2px;background:var(--ink);border-radius:2px;transform-origin:50% 0;transform:rotate(calc(180deg + var(--f)*1turn));transition:transform .9s linear;opacity:.25}
.tclock b{position:relative;z-index:1;font-family:var(--display);font-weight:400;font-size:22px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.tclock .bell{position:absolute;top:-7px;width:20px;height:14px;background:var(--red);border:4px solid var(--ink);border-radius:12px 12px 4px 4px}

</script><script>

  raf=requestAnimationFrame(tick);
}

}

  const t=e.target.closest('button');if(!t)return;
