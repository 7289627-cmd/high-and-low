<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>High &amp; Low</title>
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one-screen pass-and-play stage. Bean cast on a sky backdrop over a strip of ground, action tray pinned at the bottom. Single committed cartoon look. */
:root{
  --sky:#7FD0E4; --sky-deep:#5BB8D2; --ground:#F4C04F; --ground-dark:#D9A22F;
  --ink:#1E2240; --paper:#FFF8EC; --paper-2:#F1E4CB; --red:#EE4B3B; --green:#2FA36B;
  --yellow:#FFD23F; --muted:#545C7D; --monster:#6CC24A; --white:#FFFFFF;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme: light;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.35;
  background:linear-gradient(to top,var(--ground) 0 58px,var(--ground-dark) 58px 62px,var(--sky) 62px)}
button{font:inherit;color:inherit}
#app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}

/* Logo */
.logo{font-family:var(--display);color:var(--white);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;letter-spacing:.01em;line-height:1;margin:0;font-weight:400}
.logo span{color:var(--yellow);margin:0 .08em}
.logo.big{font-size:clamp(46px,13vw,68px);text-align:center;text-wrap:balance}
.logo.small{font-size:24px;-webkit-text-stroke:4px var(--ink)}

/* Buttons */
.btn{font-family:var(--display);font-size:18px;letter-spacing:.02em;background:var(--white);border:3px solid var(--ink);border-radius:14px;padding:9px 18px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--red);color:var(--white)}
.btn.go{background:var(--green);color:var(--white)}
.btn.big{font-size:24px;padding:12px 22px}
.btn.sm{font-size:15px;padding:5px 12px;box-shadow:0 3px 0 var(--ink)}
.link{background:none;border:0;padding:0;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}

/* Header */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .logo{margin-right:auto}
.pill{font-weight:800;background:var(--paper);border:3px solid var(--ink);border-radius:99px;padding:1px 12px;font-variant-numeric:tabular-nums}

/* Bean */
.bean{display:block;width:100%;height:auto;overflow:visible}
.bob{animation:bob 1.8s ease-in-out infinite;transform-origin:50% 100%}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3px) scale(1.03,.97)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

/* Cast */
.cast{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;align-content:start;padding:30px 3px 8px}
.card{position:relative;display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:center;text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:8px 10px;box-shadow:0 4px 0 var(--ink);cursor:default}
.card.pick{cursor:pointer}
.card.pick:hover{transform:translateY(-2px)}
.card.is-turn{background:#FFF0BF}
.card.is-target{outline:4px solid var(--red);outline-offset:2px}
.card.dead{background:var(--paper-2);border-style:dashed;box-shadow:none}
.pic{position:relative;display:block;width:58px}
.info{display:grid;gap:3px;min-width:0}
.nm{font-family:var(--display);font-size:19px;line-height:1.05;display:flex;align-items:center;gap:5px;min-width:0}
.nm b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:.08em;background:var(--ink);color:var(--white);border-radius:5px;padding:0 5px;flex:none}
.tag.up{background:var(--red)}
.hearts{font-size:15px;line-height:1;letter-spacing:1px;color:var(--red)}
.hearts .lost{color:#C9C2B2}
.left{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.zone{justify-self:start;font-size:11px;font-weight:800;letter-spacing:.06em;background:var(--ink);color:var(--yellow);border-radius:6px;padding:0 6px}
.rip{font-family:var(--display);font-size:15px;color:var(--red)}
.bubble{position:absolute;bottom:92%;left:-8px;white-space:nowrap;font-family:var(--display);font-size:15px;background:var(--white);border:3px solid var(--ink);border-radius:12px;padding:1px 8px;z-index:2;animation:popIn .3s both}
.bubble.up{background:#C9F2DA}
.bubble.down{background:#FFD9D4}

/* Tray */
.tray{background:var(--paper);border:3px solid var(--ink);border-radius:22px;padding:12px 14px 14px;box-shadow:0 5px 0 var(--ink);display:grid;gap:8px}
.turn{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center}
.turn-name{font-family:var(--display);font-size:21px;line-height:1.1}
.msg{font-size:14px;color:var(--muted);font-weight:600}
.q{margin:0;font-weight:700;font-size:17px}
.hint{margin:0;font-weight:700}
.sub{font-size:14px;color:var(--muted);font-weight:600;display:flex;flex-wrap:wrap;gap:4px 12px;font-variant-numeric:tabular-nums}
.ask-row{display:flex;gap:8px}
.ask-row input{flex:1;min-width:0;font-family:var(--display);font-size:24px;border:3px solid var(--ink);border-radius:14px;padding:4px 12px;background:var(--white);color:var(--ink);font-variant-numeric:tabular-nums}
.err{margin:0;color:var(--red);font-weight:700;font-size:14px;min-height:0}
.err:empty{display:none}
.guess-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.g{font-family:var(--display);font-size:17px;background:var(--white);border:3px solid var(--ink);border-radius:12px;padding:8px 2px;box-shadow:0 3px 0 var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.g:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.g:disabled{background:var(--paper-2);color:#A79F8E;text-decoration:line-through;box-shadow:none;cursor:default}

/* Setup */
.setup{flex:1;min-height:0;overflow:auto;display:grid;gap:14px;align-content:start;padding-block:6px 24px}
.hero{display:grid;gap:10px;justify-items:center;text-align:center}
.lineup{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.lineup .lu{width:46px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:12px 14px;display:grid;gap:10px;box-shadow:0 4px 0 var(--ink)}
.panel h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;display:flex;align-items:baseline;gap:8px}
.panel h2 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:700}
.rows{display:grid;gap:8px}
.seg{font-weight:700;font-size:13px;border:2px solid var(--ink);background:var(--white);border-radius:10px;padding:4px 8px;cursor:pointer}
.seg.on{background:var(--ink);color:var(--white)}
.x{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--white);font-weight:800;line-height:1;cursor:pointer;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{font-weight:700;font-size:15px;border:2px solid var(--ink);background:var(--white);border-radius:99px;padding:4px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.note{margin:0;font-size:14px;color:var(--muted);font-weight:600}
#startBtn{justify-self:center}

/* Overlay */
#ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(30,34,64,.62);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:16px;display:grid;gap:10px}
.sheet.center{text-align:center;justify-items:center}
.sheet h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.1;text-wrap:balance}
.sheet p{margin:0;font-weight:600;color:var(--muted);max-width:36ch}
.sheet .ask-row{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Death stage */
.stage{position:relative;width:100%;height:250px;border-radius:18px;overflow:hidden;background:var(--sky-deep);border:3px solid var(--ink)}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:var(--ground);border-top:3px solid var(--ink);z-index:0}
.actor{position:absolute;bottom:40px;left:50%;width:110px;margin-left:-55px;transform-origin:50% 100%;z-index:2}
.layer-dead{position:absolute;inset:0;opacity:0;animation:appear .01s linear both}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes drop{to{transform:translateY(0)}}
@keyframes puff{0%{opacity:0;transform:scale(.3)}30%{opacity:.95}100%{opacity:0;transform:translateX(var(--dx,0)) scale(1.7)}}
.puff{position:absolute;bottom:38px;width:48px;height:30px;border-radius:50%;background:var(--white);border:2px solid var(--ink);z-index:3;animation:puff .8s ease-out .9s both}
.puff.big{width:70px;height:44px}

/* anvil */
.anvil{position:absolute;left:50%;width:124px;margin-left:-62px;bottom:64px;z-index:4;transform:translateY(-440px);animation:drop .42s cubic-bezier(.55,0,1,.45) .46s forwards}
/* zap */
.cloud{position:absolute;top:6px;left:50%;width:150px;margin-left:-75px;z-index:4;animation:appear .4s ease both}
.flash{position:absolute;inset:0;background:var(--white);z-index:6;opacity:0;animation:flash .6s linear .55s both}
@keyframes flash{0%,20%,40%,100%{opacity:0}10%,30%,55%{opacity:1}}
/* rocket */
@keyframes launch{to{transform:translateY(-560px) rotate(-6deg)}}
.flame{transform-box:fill-box;transform-origin:50% 0;opacity:0;animation:appear .01s linear 1s both,flicker .09s linear 1s infinite alternate}
@keyframes flicker{to{transform:scaleY(1.3)}}
/* chomp */
.teeth{position:absolute;left:0;width:100%;height:26px}
.mon-eyes{position:absolute;left:50%;bottom:30px;width:120px;margin-left:-60px}
/* melt */
.sun{position:absolute;top:-46px;right:-46px;width:150px;height:150px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);box-shadow:0 0 0 18px rgba(255,210,63,.35);z-index:1;transform:scale(.3);animation:sunIn 1s ease-out both}
@keyframes sunIn{to{transform:scale(1.15)}}
.puddle{position:absolute;bottom:30px;left:50%;height:22px;width:0;border-radius:50%;border:3px solid var(--ink);transform:translateX(-50%);z-index:1;animation:grow 1.6s ease-in .8s forwards}
@keyframes grow{to{width:230px}}
@keyframes melt{to{transform:scale(2,.08)}}
/* pop */
.bit{position:absolute;left:50%;bottom:112px;width:12px;height:12px;margin-left:-6px;border-radius:3px;border:2px solid var(--ink);z-index:3;animation:burst .9s ease-out 1.55s both}
@keyframes burst{0%{opacity:0;transform:translate(0,0)}1%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r))}}
.pow{position:absolute;top:28%;left:0;right:0;text-align:center;z-index:6;font-family:var(--display);font-size:58px;color:var(--white);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;animation:popIn .4s 1.55s both}
/* bonk */
.pot{position:absolute;left:50%;width:56px;margin-left:-28px;bottom:158px;z-index:4;transform:translateY(-320px);animation:drop .38s cubic-bezier(.55,0,1,.45) .4s forwards,potOff .7s ease-in 1s forwards}
@keyframes potOff{from{transform:translateY(0)}to{transform:translate(110px,170px) rotate(160deg);opacity:0}}
.a-bonk{animation:bonk .35s ease-out .78s}
@keyframes bonk{40%{transform:scale(1.12,.82)}100%{transform:scale(1)}}
.stars{position:absolute;bottom:178px;left:50%;width:90px;margin-left:-45px;text-align:center;z-index:4;color:var(--yellow);font-size:24px;-webkit-text-stroke:1.5px var(--ink);animation:appear .2s .85s both,spin 1s linear .85s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* win */
.a-dance{animation:dance .5s ease-in-out infinite alternate}
@keyframes dance{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-26px) rotate(6deg)}}
.fall{position:absolute;top:-20px;width:10px;height:14px;border:2px solid var(--ink);border-radius:2px;z-index:1;animation:fall 2.4s linear infinite both}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(290px) rotate(540deg)}}

@media (prefers-reduced-motion:reduce){
  .bob,.eyes,.a-dance,.fall,.stars{animation:none!important}
}
@media (max-width:380px){.seg{padding:3px 6px}}

/* v2: multiplayer rooms, mobile-first */
.scroll{flex:1;min-height:0;overflow:auto;display:grid;gap:12px;align-content:start;padding:4px 3px 20px}
.center{text-align:center;justify-items:center}
.code{font-family:var(--display);font-size:clamp(52px,17vw,72px);letter-spacing:.14em;line-height:1;color:var(--ink);padding-left:.14em}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;letter-spacing:.04em}
.status i{width:10px;height:10px;border-radius:50%;background:var(--green);border:2px solid var(--ink)}
.status.off i{background:var(--red)}
.status.solo i{background:var(--yellow)}
.plist{display:grid;gap:8px}
.prow2{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center}
.prow2 .who{font-family:var(--display);font-size:19px;display:flex;align-items:center;gap:6px;min-width:0}
.prow2 .who b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.state-ok{font-weight:800;font-size:13px;color:var(--green)}
.state-wait{font-weight:800;font-size:13px;color:var(--muted)}
.field{display:grid;gap:4px}
.field label{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input{font:700 20px var(--body);border:3px solid var(--ink);border-radius:14px;padding:6px 12px;background:var(--white);color:var(--ink);min-width:0;width:100%}
.join-row{display:flex;gap:8px}
.join-row input{flex:1;min-width:0;font-family:var(--display);font-size:26px;letter-spacing:.2em;text-transform:uppercase;border:3px solid var(--ink);border-radius:14px;padding:4px 12px;background:var(--white);color:var(--ink)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;font-size:13px;letter-spacing:.1em}
.or::before,.or::after{content:"";flex:1;height:2px;background:var(--paper-2)}
.card.mine{background:#E6F6FB}
.reveal{font-size:13px}
.secret-big{font-family:var(--display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.ready-list{display:grid;gap:6px;width:100%}
.big-bean{width:110px}
.tip{font-size:14px;color:var(--muted);font-weight:600;margin:0}
.warn{background:#FFE7E3;border:3px solid var(--ink);border-radius:16px;padding:10px 12px;font-weight:600;font-size:14px}
.btn.full{width:100%}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* v3: split-screen ask + number pad */
.askv{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.ask-top{display:flex;align-items:center;gap:10px}
.split{flex:1;min-height:0;position:relative;display:grid;grid-template-rows:1fr 1fr;gap:12px;padding-bottom:6px}
.half{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);cursor:pointer;padding:18px 12px;overflow:hidden;transition:transform .08s,box-shadow .08s}
.half:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.half.hi{background:var(--green);justify-content:flex-start}
.half.lo{background:var(--red);justify-content:flex-end}
.half::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.08) 0 14px,transparent 14px 28px);pointer-events:none}
.half .arrow{width:clamp(56px,16vw,84px);height:auto;animation:nudgeUp 1.1s ease-in-out infinite}
.half.lo .arrow{animation-name:nudgeDn}
@keyframes nudgeUp{50%{transform:translateY(-8px)}}
@keyframes nudgeDn{50%{transform:translateY(8px)}}
.half .word{font-family:var(--display);font-size:clamp(38px,12vw,56px);color:var(--white);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;letter-spacing:.04em;line-height:1}
.speaker{position:absolute;left:50%;top:calc(50% - 3px);transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;pointer-events:none;z-index:2}
.spk-bean{display:block;width:70px;flex:none}
.speech{position:relative;background:var(--white);border:3px solid var(--ink);border-radius:18px;padding:6px 14px;font-family:var(--display);font-size:24px;line-height:1.15;box-shadow:0 4px 0 var(--ink);white-space:nowrap}
.speech::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:12px solid var(--ink);border-left:0}
.speech::after{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-right:9px solid var(--white);border-left:0}
.say{display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;align-items:center;padding-top:6px}
.say .spk-bean{width:80px}
.speech.big{white-space:normal;font-size:clamp(22px,7vw,30px);display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:10px 14px}
.dirword{font-family:var(--display);font-size:inherit;color:var(--white);border:3px solid var(--ink);border-radius:12px;padding:0 10px;cursor:pointer;line-height:1.2;box-shadow:0 3px 0 var(--ink);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill}
.dirword.hi{background:var(--green)}
.dirword.lo{background:var(--red)}
.numslot{display:inline-block;min-width:3.2ch;font-variant-numeric:tabular-nums;color:var(--red);border-bottom:3px dashed var(--ink);text-align:center}
.jit{display:inline-block;animation:jit .28s linear infinite}
.jit-slow{animation:jit .5s linear infinite}
@keyframes jit{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-1px,1px) rotate(-2.5deg)}50%{transform:translate(1px,-1px) rotate(2deg)}75%{transform:translate(-1px,0) rotate(-1.5deg)}100%{transform:translate(1px,1px) rotate(1deg)}}
.land{animation:land .55s cubic-bezier(.3,1.4,.5,1) both}
@keyframes land{0%{transform:translateY(-140px) scale(1.5) rotate(-8deg);opacity:0}55%{transform:translateY(6px) scale(1.08,.8);opacity:1}78%{transform:translateY(-4px) scale(.97,1.05)}100%{transform:none}}
.speech.pop{animation:popIn .3s both}
.yap{transform-box:fill-box;transform-origin:center;animation:yap .22s ease-in-out infinite alternate}
@keyframes yap{to{transform:scaleY(.35)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;margin-top:auto}
.pad.rise{animation:rise .35s ease-out both}
@keyframes rise{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
.key{font-family:var(--display);font-size:28px;height:56px;background:var(--white);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);cursor:pointer;display:grid;place-items:center;transition:transform .05s,box-shadow .05s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);background:var(--paper)}
.key.del{background:var(--paper-2)}
.key.mid{background:var(--yellow);font-size:20px;letter-spacing:.06em}
.secret-big.entry{font-size:48px;color:var(--red);min-height:52px}
@media (max-height:640px){.key{height:48px;font-size:24px}.say .spk-bean{width:64px}.say{grid-template-columns:64px minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.jit,.jit-slow,.yap,.blink,.half .arrow{animation:none!important}.land,.pad.rise,.speech.pop{animation-duration:.01ms!important}}
#ov[hidden]{display:none}
.askv .say{flex:1;min-height:0;grid-template-columns:clamp(80px,26vw,120px) minmax(0,1fr)}
.askv .say .spk-bean{width:clamp(80px,26vw,120px)}
.askv .pad{margin-top:0}
@media (max-height:640px){.askv .say{grid-template-columns:64px minmax(0,1fr)}.askv .say .spk-bean{width:64px}}

}

/* ---- finishing pass ---- */
/* Worker B: bean picker, taunts, awards, hats */

.lpic{position:relative;display:block}
.prow2 .btn.sm{white-space:nowrap}
.picker{display:grid;gap:10px;background:var(--paper-2);border:3px solid var(--ink);border-radius:16px;padding:10px;margin-top:4px}
.pk-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pk-sw,.pk-hat{position:relative;font:inherit;color:var(--ink);background:var(--white);border:3px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:4px;cursor:pointer;display:grid;justify-items:center;gap:2px;min-width:0}
.pk-sw svg{width:100%;max-width:38px;height:auto;aspect-ratio:100/140}
.pk-sw:disabled{opacity:.35;cursor:not-allowed}
.pk-sw.sel,.pk-hat.sel{outline:4px solid var(--ink);outline-offset:2px}
.pk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pk-hat{padding:6px 4px}
.pk-hat .hb svg{width:44px;height:auto;aspect-ratio:100/140;display:block}
.pk-hat .hn{font-family:var(--display);font-size:14px;line-height:1.1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pk-hat.locked{background:var(--paper);cursor:not-allowed}
.pk-hat.locked .hb{opacity:.45;filter:grayscale(.6)}
.pk-hat .lockb{position:absolute;top:4px;right:4px;background:var(--yellow);border:2px solid var(--ink);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;z-index:1}
.taunt-bar{display:flex;justify-content:center;gap:8px;margin-top:2px}
.taunt-wrap{display:flex;justify-content:center}
.taunt-btn{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--white);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:20px;line-height:1;padding:0;cursor:pointer;display:grid;place-items:center}
.taunt-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.taunt-btn:disabled{opacity:.45;cursor:default}
.taunt-pop{position:absolute;left:50%;top:-6px;margin-left:-14px;font-size:26px;line-height:1;pointer-events:none;z-index:5;animation:tauntfloat 1.6s ease-out both}
@keyframes tauntfloat{0%{transform:translateY(0) scale(.6);opacity:0}12%{transform:translateY(-5px) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translateY(-40px) scale(1);opacity:0}}
.wins-pill{justify-self:center;margin:8px auto 0;display:inline-block;font-family:var(--display);font-size:15px;background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:2px 12px;box-shadow:0 3px 0 var(--ink)}
.newhat{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0;padding:8px 12px;background:var(--yellow);border:3px solid var(--ink);border-radius:16px;font-family:var(--display);font-weight:400}
.newhat .nh-bean svg{width:44px;height:auto;display:block}
.awards{display:grid;gap:6px;margin:10px 0;text-align:left}
.award{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--paper-2);border:3px solid var(--ink);border-radius:14px;padding:4px 8px}
.award .aw-bean svg{width:30px;height:auto;display:block}
.award .aw-txt{display:grid;min-width:0}
.award .aw-txt b{font-family:var(--display);font-weight:400;font-size:16px}
.award .aw-txt span{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.award .aw-stat{font-size:12px;text-align:right;max-width:110px}

/* Smart slots, range ruler, left counts */
.left b{color:var(--ink)}
.askv .say{min-height:132px}

/* Coins and powers */
.coin-pill{display:inline-flex;align-items:center;gap:3px;flex:none;font-family:var(--display);font-weight:400;font-size:13px;line-height:1;background:var(--white);border:2px solid var(--ink);border-radius:999px;padding:1px 7px 1px 3px;color:var(--ink)}
.coin-pill b{font-weight:400}
.coin-pill svg{display:block;flex:none}
.pw-ic-sm{flex:none;font-size:15px;line-height:1}
.pw-par{flex:none;font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:.06em;line-height:1.4;border:2px solid var(--ink);border-radius:6px;padding:0 4px;background:var(--sky)}
.pw-par.even{background:var(--yellow)}
.pw-bits{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:2px 0}
.pw-btn{background:var(--yellow);flex:none;white-space:nowrap}
.pw-row{display:flex;justify-content:flex-end}
.pw-row:empty{display:none}
.ask-top{flex-wrap:wrap}
.pw-sheet{text-align:left;gap:10px}
.pw-sheet h2{text-align:center}
.pw-have{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px}
.pw-list{display:grid;gap:8px}
.pw-card{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--white);border:3px solid var(--ink);border-radius:16px;padding:6px 8px}
.pw-card.off{background:var(--paper-2)}
.pw-card.off .pw-ic{opacity:.5}
.pw-ic{font-size:28px;line-height:1;text-align:center}
.pw-tx{display:grid;gap:1px;min-width:0}
.pw-nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pw-nm b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.1}
.pw-cost{display:inline-flex;align-items:center;gap:2px;font-family:var(--display);font-size:14px}
.pw-ds{font-size:13px;font-weight:600;color:var(--ink);line-height:1.2}
.pw-why{font-style:normal;font-size:12px;font-weight:800;color:var(--red);line-height:1.2}
.pw-targets{display:grid;gap:8px}
.pw-tg{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:20px;color:var(--ink);background:var(--white);border:3px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding:6px 12px;cursor:pointer;text-align:left}
.pw-tg .mini{width:34px;flex:none}
.pw-tg b{font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw-stage{min-height:150px}
.pw-stage.stage{height:200px}
.coins-home{display:flex;align-items:center;justify-content:center;gap:5px;width:fit-content;margin-top:6px}

/* Card fit on phones: let the range wrap, keep every line inside the card */
.cast{grid-auto-rows:max-content}
.card{min-width:0;overflow:hidden}
.card .info>*{min-width:0;max-width:100%}
.zone{white-space:normal;max-width:100%}
@media (max-width:420px){.cast{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:7px}.card .nm{font-size:16px}}

/* Keep every screen inside the phone's width (wide children were stretching the page) */
.scroll{grid-template-columns:minmax(0,1fr)}
.scroll>*{min-width:0}
.join-row input,.field input{min-width:0;width:100%}

/* Private knowledge: danger meter on my card */
.dg-dots{display:inline-flex;align-items:center;gap:5px;padding:3px 0}
.dg-dots i{display:block;width:10px;height:10px;box-sizing:border-box;border:2px solid var(--ink);border-radius:50%;background:transparent}
.dg-dots i.on{background:var(--red)}
@keyframes dgshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
.card.mine.dg3{animation:dgshake .5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.card.mine.dg3{animation:none}}

/* Ask everyone: row of beans in the ask top bar */
.ask-row{display:flex;align-items:center;gap:6px;margin-left:auto;min-width:0;flex:0 1 auto;flex-wrap:nowrap}
.ar{display:flex;align-items:center;gap:6px;flex:none}
.ar .ar-b{display:block;width:24px;flex:none}
.ar .ar-b svg{display:block;width:100%;height:auto}
.ar.f{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:2px 10px 2px 5px}
.ar.f .ar-b{width:32px}
.ar-r{font-family:var(--display);font-size:14px;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.rip{display:inline-flex;align-items:center;gap:4px}
.rip .dicon{display:inline-flex;width:24px;height:24px;font-size:20px;line-height:24px;align-items:center;justify-content:center;flex:none}
.rip .dicon svg{width:24px;height:24px;display:block}
.card .bubble{bottom:auto;top:-4px;left:-4px;font-size:14px;padding:0 7px}

/* App feel: no pull-to-refresh, no double-tap zoom, no long-press selection on game screens */
html,body{overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,.invite-url{-webkit-user-select:text;user-select:text}
button{touch-action:manipulation}

/* Worker C: Play button, friends block, waiting view */
.btn.primary.big#playBtn{min-height:76px;font-size:34px;border-radius:20px;padding:10px 22px}
#friendsBtn{min-height:48px}
.friends{display:grid;gap:10px}
.friends.closed{display:none}
.hero .info-btn{position:absolute;top:0;left:0;width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:var(--white);color:var(--ink);border:3px solid var(--ink);border-radius:50%;box-shadow:0 3px 0 var(--ink);cursor:pointer;font-family:var(--display);font-size:22px;line-height:1}
.hero .info-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.waitv{justify-items:center;align-content:start;gap:14px;padding-top:14px}
.waitv .panel{width:100%}
.finding{margin:0;font-family:var(--display);font-size:24px;color:var(--ink)}
.dots i{font-style:normal;display:inline-block;animation:dotb 1.2s infinite both}
.dots i:nth-child(2){animation-delay:.2s}
.dots i:nth-child(3){animation-delay:.4s}
@keyframes dotb{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
@media (max-width:360px){.hero .logo.big{font-size:36px;-webkit-text-stroke:4px var(--ink)}.hero .lineup .lu{width:40px}.hero .lineup{gap:4px}.btn.primary.big#playBtn{font-size:32px}}

/* ---- clearer bars ---- */
.rl-caps{display:flex;justify-content:space-between;gap:8px}
.rl-caps span{font-family:var(--display);font-size:17px;line-height:1;padding:5px 9px;border:3px solid var(--ink);border-radius:10px;background:var(--white);font-variant-numeric:tabular-nums;white-space:nowrap}
.rl-caps span.yes{box-shadow:inset 0 -5px 0 var(--green)}
.rl-caps span.no{box-shadow:inset 0 -5px 0 var(--red)}
@keyframes hpdmg{0%{transform:scale(.5);opacity:0}15%{transform:scale(1.25);opacity:1}30%,75%{transform:scale(1);opacity:1}100%{transform:translateY(-6px);opacity:0}}
@keyframes hppulse{from{opacity:1}to{opacity:.55}}

/* ---- desktop ---- */
@media (min-width:820px){
  #app{max-width:520px}
  #ov .sheet{max-width:480px;margin-left:auto;margin-right:auto}
}
@media (hover:hover) and (pointer:fine){
  .btn:hover,.key:hover,.half:hover{filter:brightness(1.06)}
  .btn,.key,.half,.card[data-pid]{cursor:pointer}
}

.legal{font-size:14px}.legal a{color:var(--ink);font-weight:700}

/* ---- duel ---- */
.elo{font-family:var(--body);font-weight:800;font-size:12px;background:var(--ink);color:var(--white);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:middle;font-variant-numeric:tabular-nums}
.elo-pill b{font-family:var(--display);font-weight:400;font-size:18px;margin-right:4px}
.elo-res{display:flex;align-items:baseline;justify-content:center;gap:10px;margin:6px 0 2px;font-family:var(--display)}
.elo-res .d{font-size:30px;line-height:1}.elo-res.up .d{color:var(--green)}.elo-res.down .d{color:var(--red)}
.elo-res b{font-size:22px;font-weight:400}.elo-res span:last-child{font-family:var(--body);font-weight:800;font-size:14px}
.elo-rankup{font-family:var(--display);font-size:20px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:12px;padding:4px 12px;display:inline-block;margin:4px 0}
.cast.duel{grid-template-columns:minmax(0,1fr)!important;gap:6px;padding-top:34px;align-content:center}
.cast.duel .vs{justify-self:center;font-family:var(--display);font-size:26px;color:var(--white);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;line-height:1}
.cast.duel .card{grid-template-columns:104px minmax(0,1fr);gap:14px;padding:14px 16px;border-radius:22px;overflow:visible}
.cast.duel .card .pic{width:104px}
.cast.duel .card .nm{font-size:22px}
.cast.duel .card .left b,.cast.duel .card .zone{font-size:16px}
.cast.duel .card.mine{grid-template-columns:64px minmax(0,1fr);padding:10px 14px}
.cast.duel .card.mine .pic{width:64px}
.cast.duel .card.mine .nm{font-size:18px}
.cast.duel .card .bubble{font-size:18px;padding:2px 10px}
.guessv{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:auto;padding:2px 3px 10px}
.ped{display:flex;flex-direction:column;align-items:center;margin-top:auto}
.ped-bean{width:min(38vw,150px);position:relative;z-index:1;margin-bottom:-10px}
.ped-bean svg{width:100%;height:auto;display:block;overflow:visible}
.ped-base{width:min(62vw,240px);background:var(--paper);border:4px solid var(--ink);border-radius:16px 16px 6px 6px;box-shadow:0 6px 0 var(--ink);text-align:center;padding:14px 8px 8px;position:relative}
.ped-base:before{content:"";position:absolute;left:-10px;right:-10px;top:-8px;height:14px;background:var(--yellow);border:4px solid var(--ink);border-radius:10px}
.ped-base b{font-family:var(--display);font-weight:400;font-size:22px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ped-q{font-family:var(--display);font-size:26px;text-align:center;margin:14px 0 2px;color:var(--white);-webkit-text-stroke:5px var(--ink);paint-order:stroke fill}
.guess-grid.big{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:auto}
.guess-grid.big.n1,.guess-grid.big.n2,.guess-grid.big.n3,.guess-grid.big.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
.guess-grid.big.n5,.guess-grid.big.n6{grid-template-columns:repeat(3,minmax(0,1fr))}
.guess-grid.big .g{min-height:64px;font-family:var(--display);font-size:clamp(17px,5.2vw,26px);padding:4px 2px;border:3px solid var(--ink);border-radius:14px;background:var(--white);box-shadow:0 4px 0 var(--ink);color:var(--ink)}
.guess-grid.big .g:disabled{opacity:.35;text-decoration:line-through;box-shadow:none;transform:translateY(4px)}
.guess-grid.big .g:active{transform:translateY(4px);box-shadow:none}

/* ---- slider ---- */
.sld{touch-action:none;user-select:none;-webkit-user-select:none;padding:14px 0 2px;cursor:pointer;outline:none}
.sld-track{position:relative;display:flex;height:58px;border:4px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);background:var(--paper-2)}
.sld-track i{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;font-style:normal}
.sld-track i:first-child{border-radius:13px 0 0 13px}.sld-track i:nth-child(2){border-radius:0 13px 13px 0}
.sld-track i.yes{background:var(--green)}.sld-track i.no{background:var(--red)}
.sld-track i em{font-family:var(--display);font-style:normal;font-size:22px;color:var(--white);letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.sld-track i.tiny em{display:none}
.sld-thumb{position:absolute;top:-14px;bottom:-14px;width:30px;margin-left:-15px;background:var(--white);border:4px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);pointer-events:none}
.sld-thumb:after{content:"";position:absolute;left:50%;top:22%;bottom:22%;width:4px;margin-left:-2px;border-radius:2px;background:var(--ink);opacity:.35}
.sld.drag .sld-thumb{background:var(--yellow);transform:scale(1.08)}
.sld .rl-caps{margin-top:16px}
.bignum{font-family:var(--display);font-size:clamp(40px,13vw,58px);line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.speech.big .numslot{align-items:baseline}
.speech.big .numslot .qm{font-size:1.3em}
.nudge{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;margin-top:auto}
.nudge .key{height:56px}.nudge .key.nb{font-size:34px;line-height:1}
.lob-join{margin-top:12px}
.lob-join input{min-width:0}

/* ---- secret number slider ---- */
.secpick{gap:8px}
.secpick .secret-big.entry{font-size:clamp(48px,16vw,68px);min-height:0}
.sld.one .sld-track i.pick{flex:none;background:var(--yellow);border-radius:13px 0 0 13px}
.sld-ends{display:flex;justify-content:space-between;margin-top:16px;font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums;opacity:.75}
.secpick .nudge{margin-top:4px}
.secpick .nudge .key.mid{font-size:18px}

.secpick .sld,.secpick .nudge{width:100%;justify-self:stretch}
.stake{font-size:18px;margin:6px 0 14px}.stake b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--red)}

/* ---- play modes ---- */
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:2px 0 10px}
.mode{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;background:var(--white);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);color:var(--ink);font-family:var(--display);cursor:pointer;opacity:.72}
.mode svg{width:40px;height:40px;display:block}
.mode b{font-weight:400;font-size:clamp(13px,3.9vw,16px);white-space:nowrap;font-variant-numeric:tabular-nums}
.mode em{position:absolute;top:-9px;right:-5px;font-style:normal;font-size:13px;background:var(--red);color:var(--white);border:3px solid var(--ink);border-radius:99px;padding:1px 7px;line-height:1.2}
.mode[aria-checked="true"]{opacity:1;background:var(--yellow);transform:translateY(-3px);box-shadow:0 7px 0 var(--ink)}
.mode:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}

/* ---- cartoon turn clock ---- */
.tclock{position:relative;display:inline-block;width:56px;height:56px;flex:none;vertical-align:middle;transform-origin:50% 90%;animation:clockSway 3.6s ease-in-out infinite}
.tclock .face{position:absolute;inset:0;border-radius:50%;border:4px solid var(--ink);background:conic-gradient(var(--yellow) calc(var(--f)*1turn),var(--white) 0);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;transition:background .3s}
.tclock .face:after{content:"";position:absolute;left:50%;top:50%;width:4px;height:42%;margin-left:-2px;background:var(--ink);border-radius:2px;transform-origin:50% 0;transform:rotate(calc(180deg + var(--f)*1turn));transition:transform .9s linear;opacity:.25}
.tclock b{position:relative;z-index:1;font-family:var(--display);font-weight:400;font-size:22px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.tclock .bell{position:absolute;top:-7px;width:20px;height:14px;background:var(--red);border:4px solid var(--ink);border-radius:12px 12px 4px 4px}
.tclock .bell.l{left:0;transform:rotate(-32deg)}.tclock .bell.r{right:0;transform:rotate(32deg)}
.tclock .foot{position:absolute;bottom:-7px;width:9px;height:12px;background:var(--ink);border-radius:4px}
.tclock .foot.l{left:9px;transform:rotate(24deg)}.tclock .foot.r{right:9px;transform:rotate(-24deg)}
.tclock.low{animation:clockRing .28s linear infinite}
.tclock.low .face{background:conic-gradient(var(--red) calc(var(--f)*1turn),var(--white) 0)}
@keyframes clockSway{0%,100%{transform:rotate(-5deg) scale(1)}50%{transform:rotate(5deg) scale(1.06)}}
@keyframes clockRing{0%,100%{transform:rotate(-9deg) scale(1.08)}50%{transform:rotate(9deg) scale(1.08)}}
.cast{position:relative}
.clock-corner{position:absolute;left:2px;top:0;z-index:3;pointer-events:none}
.clock-corner:empty{display:none}
.cast.duel .clock-corner{top:-6px}
.ask-top .tclock,.guessv .ask-top .tclock{margin:4px 6px 0 2px}
/* ---- living home screen ---- */
.hscene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(to bottom,#49B9DF 0%,#7FD6EE 38%,#C9F0EC 66%,#FFF3C4 86%)}
.scroll.home>section{position:relative;z-index:1}
.hscene svg{display:block;overflow:visible}
.hs-b svg,.hs-walk svg,.hs-kiter svg,.hs-run svg,.hs-nap svg{width:100%;height:auto}
.hsun{position:absolute;left:-40px;top:66px;width:128px;height:128px}
.hsun .rays{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
.skygap{height:76px}
@keyframes spin{to{transform:rotate(360deg)}}
.hscene .cloud{position:absolute;left:0;width:120px;height:38px;background:#fff;border-radius:40px;opacity:.92;animation:cloudDrift 70s linear infinite;filter:drop-shadow(0 5px 0 rgba(30,34,64,.10))}
.hscene .cloud:before,.hscene .cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}
.hscene .cloud:before{width:54px;height:54px;left:18px;top:-24px}.hscene .cloud:after{width:40px;height:40px;right:20px;top:-16px}
.hscene .c1{top:8%}.hscene .c2{top:25%;scale:.7;animation-duration:95s;opacity:.8}.hscene .c3{top:44%;animation-duration:120s;opacity:.7;scale:1.15}.hscene .c4{top:60%;scale:.55;animation-duration:84s;opacity:.75}
@keyframes cloudDrift{from{translate:-170px 0}to{translate:calc(100vw + 60px) 0}}
.bird{position:absolute;left:0;top:15%;width:26px;animation:birdFly 24s linear infinite}
.bird svg{width:100%;height:auto;transform-origin:50% 70%;animation:flap .5s ease-in-out infinite alternate}
.bird.b2{top:18%;width:20px}.bird.b3{top:36%;width:22px;animation-duration:31s}
@keyframes birdFly{0%{translate:-60px 0}50%{translate:50vw -26px}100%{translate:calc(100vw + 60px) 6px}}
@keyframes flap{from{scale:1 1}to{scale:1 .35}}
.hscene .fnum{position:absolute;bottom:150px;font-family:var(--display);font-size:26px;color:#fff;opacity:0;animation:numRise 18s linear infinite;text-shadow:0 2px 0 rgba(30,34,64,.18)}
@keyframes numRise{0%{translate:0 0;opacity:0;rotate:-10deg}8%{opacity:.55}60%{opacity:.35}100%{translate:18px -66vh;opacity:0;rotate:14deg}}
.hill{position:absolute;left:-2%;width:104%}
.hill.far{bottom:40px;height:210px}
.hill.near{bottom:30px;height:130px}
.tree{position:absolute;width:64px;height:92px;margin-left:-32px;scale:var(--s);transform-origin:50% 100%;animation:sway 4.5s ease-in-out infinite alternate}
.tree .trunk{position:absolute;left:50%;bottom:0;width:12px;height:42px;margin-left:-6px;background:#9A6442;border:4px solid var(--ink);border-radius:5px}
.tree .crown{position:absolute;left:4px;top:0;width:56px;height:56px;border-radius:50%;background:#2E9E68;border:4px solid var(--ink);z-index:1}
.tree .crown.c2{left:22px;top:14px;width:26px;height:22px;border:0;background:#58C98D;border-radius:50%;z-index:2}
@keyframes sway{from{rotate:-3deg}to{rotate:3deg}}
.flower{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--c);border:3px solid var(--ink);transform-origin:50% 200%;animation:sway 2.6s ease-in-out infinite alternate}
.flower:after{content:"";position:absolute;left:50%;top:100%;width:3px;height:10px;margin-left:-1.5px;background:var(--ink)}
.path{position:absolute;left:0;right:0;bottom:0;height:58px;background:var(--ground);border-top:5px solid var(--ink);box-shadow:inset 0 9px 0 rgba(255,255,255,.28)}
.kitesvg{position:absolute;inset:0;width:100%;height:100%}
.hs-b,.hs-walk,.hs-kiter,.hs-run{position:absolute;bottom:46px;width:52px}
.hs-catch{position:absolute;left:5%;bottom:0;width:150px;height:140px}
.hs-catch .hs-b.a{left:0;animation:catchHop 2.8s ease-in-out infinite}
.hs-catch .hs-b.b{right:0;animation:catchHop 2.8s ease-in-out infinite}
.hs-catch .hs-b.b svg{transform:scaleX(-1)}
.hs-ballx{position:absolute;left:44px;bottom:80px;width:62px;animation:ballX 2.8s linear infinite}
.hs-bally{display:block;width:16px;height:16px;border-radius:50%;background:var(--red);border:3px solid var(--ink);animation:ballY 1.4s cubic-bezier(.3,0,.7,1) infinite}
@keyframes ballX{0%,100%{translate:0 0}50%{translate:46px 0}}
@keyframes ballY{0%,100%{translate:0 0}50%{translate:0 -46px}}
@keyframes catchHop{0%,12%,100%{translate:0 0;scale:1 1}4%{translate:0 -9px;scale:.96 1.05}8%{translate:0 0;scale:1.06 .94}}
.hs-walk{left:0;animation:walkAcross 26s linear infinite}
.hs-waddle{display:block;transform-origin:50% 100%;animation:waddle .5s ease-in-out infinite alternate}
@keyframes walkAcross{0%{translate:-70px 0;scale:1 1}49.9%{translate:calc(100vw + 20px) 0;scale:1 1}50%{translate:calc(100vw + 20px) 0;scale:-1 1}99.9%{translate:-70px 0;scale:-1 1}100%{translate:-70px 0;scale:1 1}}
@keyframes waddle{from{rotate:-7deg}to{rotate:7deg}}
.hs-kiter{right:6%;transform-origin:50% 100%;animation:kiterLean 3.4s ease-in-out infinite alternate}
@keyframes kiterLean{from{rotate:4deg;translate:0 0}to{rotate:12deg;translate:5px 0}}
.hs-chase{position:absolute;left:0;bottom:0;width:140px;height:110px;animation:chase 19s linear infinite}
.hs-run{animation:waddle .22s ease-in-out infinite alternate;transform-origin:50% 100%}
.hs-run.r1{left:0}.hs-run.r2{left:78px}
@keyframes chase{0%,62%{translate:-170px 0}86%,100%{translate:calc(100vw + 30px) 0}}

.rb{display:block;position:relative;width:100%}

/* a10 perf: the home landscape is a fixed full-screen layer. Containment keeps its many animations from invalidating layout or paint of the page above it. */
.hscene{contain:layout paint style}
/* a11 : accessibility and touch ergonomics. Nothing here changes layout or what sighted touch users see, except the ink text outline on small white-on-red/green labels. */
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

/* ---- tap targets: invisible 44px minimum hit area centred on the control (visual size unchanged) ---- */
:where(.mute-btn,.info-btn,.taunt-btn,.x,.chip-btn,.btn.sm,.dirword,.link,.legal a){position:relative}
.mute-btn::after,.info-btn::after,.taunt-btn::after,.x::after,.chip-btn::after,.btn.sm::after,.dirword::after,.link::after{
  content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
/* chips wrap with an 8px row gap, so they only grow by that much (to ~40px) to keep neighbouring hit areas apart */
.chip-btn::after{height:calc(100% + 8px)}
.pk-sw::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:max(100%,44px);transform:translateY(-50%)}
/* text links in the info sheet: grow only vertically, they sit 6px apart */
.legal a{display:inline-block;padding:0}
.legal a::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:40px;transform:translateY(-50%)}

  :root{--z:1}

  #ov .sheet{max-width:480px;margin-left:auto;margin-right:auto}
}

  html,body,#app{height:100vh;height:var(--zh)}
}}

/* c10: stop the web view feeling like a web page. ui2.css already has overscroll none, user-select none,
   no callout, transparent tap highlight and touch-action manipulation (no double-tap zoom, no 300 ms delay).
   Added here: block pinch zoom, and make sure inputs and the invite link stay selectable. */
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.btn,.key,.sld{-webkit-tap-highlight-color:transparent}
img,svg{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none}
input,textarea,.invite-url{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* d01: small phones. Nothing here applies at 390x844 and up. Width rules: under 360px. Height rules: under 600px
   (320x568, and "Safari with bars" 375x553). The default look is untouched above those sizes. */

/* ---- tap targets: chip hit area. a11's ::after used 100% of the padding box (28px), so it only reached about 36px ---- */
.chip-btn::after{top:-6px;bottom:-6px;height:auto;transform:translateX(-50%)}

/* ---- friends lobby, phones under 390 wide: YOU / HOST tags wrap under the name instead of squeezing it to an ellipsis ---- */
@media (max-width:389px){
  .prow2 .who{flex-wrap:wrap;row-gap:2px}
  .prow2 .who b{max-width:100%}
}

/* ---- narrow phones (320): header on one row, short names, join box ---- */
@media (max-width:359px){
  .bar{gap:6px}
  .logo.small{font-size:22px;-webkit-text-stroke-width:3.5px}
  .bar .btn.sm{padding:5px 9px}
  .tray{padding-left:10px;padding-right:10px}
  .taunt-bar{gap:4px}
  .join-row input{font-size:22px;letter-spacing:.12em;padding:4px 8px}
  .join-row input::placeholder{letter-spacing:.08em}
}

/* ---- short phones (568 high, or 553 with browser bars) ---- */
@media (max-height:600px){
  #app{gap:6px}
  .askv{gap:6px}
  .askv .say{min-height:0}
  .key{height:44px}
  .big-bean{width:72px}
  .secpick{gap:6px}
  .cast.duel{padding-top:30px;padding-bottom:14px;gap:4px}
  .cast.duel .card{grid-template-columns:86px minmax(0,1fr);gap:10px;padding:10px 12px}
  .cast.duel .card .pic{width:86px}
  .cast.duel .card.mine{grid-template-columns:56px minmax(0,1fr);padding:8px 12px}
  .cast.duel .card.mine .pic{width:56px}
  /* pick direction: smaller arrows, words and speaker so the bean and bubble sit in the gap between the two halves */
  .half{padding:12px 12px}
  .half .arrow{width:44px}
  .half .word{font-size:36px;-webkit-text-stroke-width:5px}
  .split{gap:10px}
  .split .spk-bean{width:54px}
  .split .speech{font-size:20px;padding:3px 12px}
  /* result sheet: shorter picture so Play again is visible */
  .sheet.has-x{padding:12px;gap:6px}
  .sheet.has-x .stage{height:168px}
}
/* d04: end of a rated duel. Rating roll, rank bar, rank-up stamp, winner and loser poses. */
@property --n{syntax:'<integer>';inherits:true;initial-value:0}

/* rank badge, small, next to the rank name on the home pill */
.elo-pill .rkb{display:inline-block;width:20px;height:20px;vertical-align:-5px;margin-right:3px}

/* result block */
.er{position:relative;width:100%;display:grid;justify-items:center;gap:9px}
.er .elo-res{margin:2px 0 0;gap:8px;flex-wrap:wrap}
.elo-res .d{display:inline-block;transform-origin:50% 70%;animation:erPop .5s .1s cubic-bezier(.3,1.8,.5,1) both}
.elo-res.down .d{animation-name:erDrop}
.elo-res b{display:inline-block;font-variant-numeric:tabular-nums}
.elo-res.down b{animation:erShake .45s ease-out both}
.elo-res.cu b{position:relative;color:transparent;animation:erCount .9s cubic-bezier(.12,.8,.25,1) both}
.elo-res.cu.down b{animation:erCount .9s cubic-bezier(.12,.8,.25,1) both,erShake .45s ease-out both}
.elo-res.cu b::after{content:counter(n);counter-reset:n var(--n);position:absolute;right:0;top:0;color:var(--ink)}
.elo-res .rk{display:inline-flex;align-items:center;gap:4px}
.elo-res .bd{position:relative;display:inline-block;width:30px;height:30px;align-self:center}
.rkb{display:block;width:100%;height:100%}
.elo-res .nm{display:inline-block}
@keyframes erCount{from{--n:var(--f)}to{--n:var(--t)}}
@keyframes erPop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes erDrop{from{transform:translateY(-12px) scale(.75);opacity:0}to{transform:none;opacity:1}}
@keyframes erShake{0%{transform:translateX(0)}18%{transform:translateX(-3px)}36%{transform:translateX(3px)}54%{transform:translateX(-2px)}72%{transform:translateX(1.5px)}100%{transform:translateX(0)}}

/* rank progress bar, same language as the in game range bar */
.er-bar{position:relative;width:min(100%,230px);height:18px;margin-bottom:3px;border:3px solid var(--ink);border-radius:9px;background:var(--paper-2);box-shadow:0 3px 0 var(--ink);overflow:hidden}
.er-bar i{position:absolute;inset:0;background:var(--green);border-right:3px solid var(--ink);box-shadow:inset 0 4px 0 rgba(255,255,255,.3);transform:translateX(calc(var(--b) - 100%));animation:erFill .9s cubic-bezier(.16,.84,.3,1) both}
.er.top .er-bar i{background:var(--yellow);border-right:0}
@keyframes erFill{from{transform:translateX(calc(var(--a) - 100%))}}
.er-bar.fu i{animation:erUp 1.6s both}
@keyframes erUp{
  0%{transform:translateX(calc(var(--a) - 100%));animation-timing-function:cubic-bezier(.16,.84,.3,1)}
  46%{transform:translateX(0);background:var(--green)}
  49%{transform:translateX(0);background:var(--yellow)}
  56%{transform:translateX(0);background:var(--yellow)}
  57%{transform:translateX(-100%);background:var(--green);animation-timing-function:cubic-bezier(.16,.84,.3,1)}
  100%{transform:translateX(calc(var(--b) - 100%))}}
.er-bar.fd i{animation:erDown 1.2s both}
@keyframes erDown{
  0%{transform:translateX(calc(var(--a) - 100%));animation-timing-function:ease-in}
  40%{transform:translateX(-100%)}
  41%{transform:translateX(-100%);animation-timing-function:cubic-bezier(.16,.84,.3,1)}
  100%{transform:translateX(calc(var(--b) - 100%))}}

/* rank-up: badge stamp, ring, name bump, one burst of paper */
.rkb.stamp{animation:erStamp .55s .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes erStamp{from{transform:scale(2.6) rotate(-16deg);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}

  0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}
  40%{transform:translate(var(--x),var(--y)) scale(1) rotate(calc(var(--r) * .6));opacity:1;animation-timing-function:cubic-bezier(.45,0,.9,.6)}
  100%{transform:translate(calc(var(--x) * 1.15),calc(var(--y) + 130px)) scale(.9) rotate(var(--r));opacity:0}}

/* winner hops, loser slumps (the loser is only drawn in rated duels) */
.stage .actor.pw2{width:100px;margin-left:-50px}
.actor.pw-w{left:32%}
.actor.pw-l{left:69%}
.a-hop{animation:erHop .72s infinite}
@keyframes erHop{
  0%{transform:translateY(0) scale(1.08,.9);animation-timing-function:cubic-bezier(.2,.8,.3,1)}
  50%{transform:translateY(-36px) scale(.94,1.07) rotate(-3deg);animation-timing-function:cubic-bezier(.7,0,.85,.4)}
  92%{transform:translateY(0) scale(.98,1.03)}
  100%{transform:translateY(0) scale(1.08,.9)}}
.a-slump{animation:erSlump .7s .25s cubic-bezier(.3,1.3,.5,1) both,erSag 3.2s .95s ease-in-out infinite}
@keyframes erSlump{from{transform:none}to{transform:rotate(9deg) scale(1.05,.84) translateY(3px)}}
@keyframes erSag{0%,100%{transform:rotate(9deg) scale(1.05,.84) translateY(3px)}50%{transform:rotate(10.5deg) scale(1.06,.82) translateY(4px)}}

@media (max-height:640px){.sheet:has(.er) .stage{height:200px}.sheet:has(.er) .stage .actor.pw2{width:84px;margin-left:-42px}}
@media (prefers-reduced-motion:reduce){
  .a-hop{animation:none}
  .a-slump,.elo-res .d,.elo-res b,.rkb.stamp,.er.ru .nm,.er-bar,.er-bar i,.bd u{animation:none!important}
  .a-slump{transform:rotate(7deg) scale(1.04,.88)}
  .elo-res.cu b{color:inherit}.elo-res.cu b::after{display:none}
  .er-conf{display:none}
}
.er .elo-res{align-items:center}
.elo-res .rk .nm{font-size:17px}
/* e02: art-director QA pass over the merged game (phone size, real fonts). Each block says what it fixes. */

/* ---- 1. white-on-red / white-on-green small labels ----
   a11 added an ink text outline (3px stroke) to 10-18px white labels. At phone size that fills the counters of the letters and closes the word spaces
   ("Removeads", "Sendinvite"). Instead the fill gets a darker shade of the same hue and the outline goes (a11's rule stays, this overrides it).
   white on #D23B2C = 4.77:1 (was 3.68 on --red), white on #217F55 = 4.96:1 (was 3.20 on --green). Big 24px+ buttons use the same shade so one family. */
:root{--red-btn:#D23B2C;--green-btn:#217F55}
.btn.primary,.tag.up,.mode em{background:var(--red-btn)}
.btn.go{background:var(--green-btn)}
.btn.primary:not(.big),.btn.go:not(.big),.btn.primary,.btn.go,.tag.up,.mode em,.sld-track i em{-webkit-text-stroke:0;paint-order:normal}
.btn.primary,.btn.go{letter-spacing:.03em}
/* YES / NO bar: 22px display text counts as large text (3:1 needed, white on the palette red/green is 3.68 / 3.20), so the outline can go too; its soft shadow stays */
.sld-track i em{letter-spacing:.06em}

/* ---- 2. result sheet button row: Play again, share and report as one family ---- */
.sheet .btn-row{align-items:center;gap:12px}
.sheet .btn-row>.btn:not(.round){min-height:52px;display:inline-flex;align-items:center;justify-content:center}
.btn.round.share-btn{width:52px;min-width:52px;height:52px}
/* the flag is secondary: smaller, white, same 3px outline and radius language. Hit area stays 44px */
.btn.round.rep-btn{width:40px;min-width:40px;height:40px;box-shadow:0 3px 0 var(--ink);position:relative}
.btn.round.rep-btn svg{width:20px;height:20px}
.btn.round.rep-btn::after{content:"";position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%)}

/* ---- 3. "i" sheet ---- */
/* app build: Remove ads, Restore purchases and Close become one stack of equal-width buttons (the underlined link beside a chunky button is gone) */
.sheet .btn-row #noAdsBtn,.sheet .btn-row #restoreBtn,.sheet .btn-row #noAdsBtn~#ovClose,.sheet .btn-row #restoreBtn~#ovClose{width:min(100%,260px)}
.sheet .btn-row #restoreBtn{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.02em;text-decoration:none;padding:9px 18px;min-height:52px;background:var(--white);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);display:inline-flex;align-items:center;justify-content:center;position:relative}
.sheet .btn-row #restoreBtn::after{display:none}
.sheet .btn-row #restoreBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
/* legal links: quiet, evenly spaced (flex gap), muted ink, not bold */
.legal{gap:22px;margin:4px 0 6px}
.legal a{color:var(--muted);font-weight:600;font-size:14px;text-decoration-thickness:1.5px}

/* ---- 4. rank badge sits on the text baseline ---- */
.elo-pill .rkb{vertical-align:-3px}
.er .elo-res{align-items:baseline}
.elo-res .rk{align-items:baseline;gap:5px}
.elo-res .bd{align-self:auto;width:26px;height:26px;margin-bottom:-3px}

/* ---- 5. rank progress bar: same outline weight as the in-game range bar (4px, 12px radius at card size) ---- */
.er-bar{height:22px;border-width:4px;border-radius:12px}
.er-bar i{border-right-width:3px}

/* ---- 6. "Watching" is quiet status text, like the other muted lines in the tray ---- */
.tray>p.hint:only-child{text-align:center;color:var(--muted);font-size:15px;font-weight:700}
.tray .hint{color:var(--muted)}

/* ---- 7. turn clock: its bells and top edge were cut off by the scroll area (duel cards, ask and guess screens) ---- */
.guessv .ask-top{padding-top:8px}
.cast.duel .clock-corner{top:16px;left:10px}
@media (min-height:601px){.cast.duel{padding-top:44px}}

/* ---- 8. header: logo, room code, status, mute and Leave fit one row in every screen (Leave was alone on a second row in rooms) ---- */
.bar{gap:8px}
.bar{flex-wrap:nowrap}
.bar .logo.small{font-size:20px;-webkit-text-stroke-width:3.5px;flex:none}
.bar .pill{padding:1px 10px}

/* ---- 9. friends lobby ---- */
.join-row{align-items:stretch}
.join-row input{box-shadow:0 4px 0 var(--ink)}
.chips:nth-of-type(1){display:grid;grid-template-columns:1fr 1fr}
.chips:nth-of-type(2){display:grid;grid-template-columns:repeat(3,1fr)}
.chips>.chip-btn{text-align:center;padding:5px 8px}
#startBtn{justify-self:stretch!important}

/* ---- 10. "Which one is it?" and other outlined display lines: the 5px outline ate the word spaces ---- */
.ped-q{word-spacing:.18em;letter-spacing:.01em}

/* ---- 11. home with the streak flag on: the rating pill stays centred on the screen (it sat 30px left of centre because the flame was centred with it) ---- */
.st-row{display:grid;grid-template-columns:1fr auto 1fr;column-gap:8px;align-items:center}
.st-row>.wins-pill{grid-column:2;justify-self:center}
.st-row>.st-flame{grid-column:3;justify-self:start}

/* lead: below 370px the room header does not fit one row; let it wrap as before so Leave stays on screen */
@media (max-width:369px){.bar{flex-wrap:wrap}}
/* e04: WebKit and old WebView fallbacks. Nothing here changes a browser that already renders correctly. */

/* 1. build.py's web reset puts the safe-area insets on <html> as padding, and a01 puts them on #app again. On a notched iPhone (viewport-fit=cover)
   that doubled the top inset and pushed the bottom of #app 59px below the screen. #app alone owns the insets (env() is 0 in desktop browsers, so no change there). */
:root{padding-top:0;padding-bottom:0}

/* 2. c09 sizes the zoomed tablet page with var(--zh) = calc(100dvh / zoom). A browser without dvh (iOS before 15.4, WebView before 108)
   drops that declaration at computed-value time, so height became auto instead of falling back to 100vh. Give it a vh based value. */
@supports not (height:1dvh){@media (min-width:600px) and (min-height:600px){html{--zh:calc(100vh / var(--z))}}}

/* 3. Android resizes the web view when the keyboard opens. A 360x300 portrait window then matched the landscape rotate cover and hid the game
   while a name or room code was typed. Real landscape phones are 16:9 or wider. */
@media (orientation:landscape) and (max-height:499px) and (pointer:coarse) and (max-aspect-ratio:3/2){.rotate-cover{display:none}}
/* f01: drawn power icons (replace emoji) */
.pw-svg{display:block;flex:none;overflow:visible}
.pw-ic{display:grid;place-items:center;width:38px;height:44px}
.pw-i44{width:44px;height:44px;margin:0 -3px}
.pw-card.off .pw-i44{opacity:.5}
.pw-ic-sm{display:inline-flex;align-items:center;line-height:0}
.pw-i18{width:18px;height:18px}
.bubble.pw-bub{display:inline-flex;align-items:center;justify-content:center;padding:1px 6px;line-height:0}
.card .bubble.pw-bub,.cast.duel .card .bubble.pw-bub{padding:1px 6px}
.pw-i28{width:28px;height:28px}
/* Home wardrobe: bean button beside the name, and the look sheet */
.field.me-row{grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px}
.me-btn{width:54px;height:54px;border-radius:50%;background:var(--white);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);padding:0;display:grid;place-items:center;cursor:pointer;overflow:hidden;flex:none}
.me-btn svg{width:34px;height:auto;aspect-ratio:100/140;display:block;margin-top:4px}
.me-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.looksheet{max-height:calc(100% - 24px);overflow:auto}
.looksheet .look-me svg{width:84px;height:auto;aspect-ratio:100/140;display:block;margin:0 auto 6px}
.looksheet .picker{margin-top:0}

/* Playable ad layout. Everything visual (palette, outlines, buttons, slider, range bar, bubbles, death stage,
   rating block, logo) comes from the game's own CSS that build.py puts in front of this file.
   Only the ad's arrangement is defined here. */
html{zoom:1!important}  /* the game's tablet zoom (zz_c09) must not stack on the ad's own scaling */
html,body{height:100%;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{background:#8EDDF0}
#sky{position:fixed;inset:0;z-index:0}
#sky .hs-catch,#sky .hs-walk,#sky .hs-chase,#sky .hs-kiter,#sky .kitesvg,#sky .bfly{display:none}
#ad{position:fixed;left:0;top:0;z-index:2;transform-origin:0 0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0 18px;touch-action:none;overflow:hidden}
#ad>*{width:min(100% - 24px,460px);flex:none}
#ad>.pa-opp{flex:1 1 auto}
#ad>.pa-pips{width:auto}
.pa-paused *{animation-play-state:paused!important}

/* three guess pips */
.pa-pips{display:flex;justify-content:center;gap:16px;height:30px;align-items:center;animation:paDrop .45s cubic-bezier(.3,1.5,.5,1) both}
.pa-pips i{display:block;width:26px;height:26px;border-radius:50%;border:4px solid var(--ink);background:var(--white);box-shadow:0 3px 0 var(--ink);transition:background .15s}
.pa-pips i.on{background:var(--yellow);animation:popIn .35s both}

/* opponent on the pedestal */
.pa-opp{position:relative;flex:1 1 auto;min-height:240px;display:block}
.pa-ped{position:absolute;left:33%;bottom:0;width:176px;height:96px;margin-left:-88px;animation:paDrop .6s cubic-bezier(.3,1.4,.5,1) .15s both}
.pa-pedsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.pa-obean{position:absolute;left:50%;bottom:78px;width:104px;margin-left:-52px;z-index:1}
.pa-ob{width:100%}
.pa-obean .bean{width:100%}
.pa-card{position:absolute;left:50%;top:44px;width:76px;height:46px;margin-left:-38px;perspective:400px;z-index:2}
.pa-cardin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.pa-card.rev .pa-cardin{transform:rotateY(180deg)}
.pa-f{position:absolute;inset:0;display:grid;place-items:center;background:var(--white);border:3px solid var(--ink);border-radius:11px;box-shadow:0 3px 0 var(--ink);font-family:var(--display);font-weight:400;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pa-f.q{font-size:36px;color:var(--red);line-height:1;animation:paWob 1.6s ease-in-out infinite alternate}
.pa-f.n{font-size:30px;color:var(--ink);background:var(--yellow);transform:rotateY(180deg)}
.pa-card.wob{animation:paCardWob 1s ease-in-out .05s both}
@keyframes paCardWob{0%{transform:none}12%{transform:rotate(-12deg) scale(1.12)}28%{transform:rotate(11deg) scale(1.12)}44%{transform:rotate(-8deg) scale(1.06)}60%{transform:rotate(6deg)}78%{transform:rotate(-3deg)}100%{transform:none}}
@keyframes paWob{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@keyframes paDrop{from{transform:translateY(-26px);opacity:0}to{transform:none;opacity:1}}

/* opponent's answer bubble */

.pa-arr svg,.pa-tick svg{display:block;width:100%;height:100%}
.pa-ans-in.hi .pa-arr svg path{fill:var(--green)}
.pa-ans-in.lo .pa-arr svg path{fill:var(--red)}

const RANKS=[[0,'Rookie'],[1050,'Guesser'],[1150,'Sharp'],[1300,'Hunter'],[1450,'Mind Reader'],[1600,'Mastermind']];

function pendClear(gid){try{const p=LS.get(LSK('hl-pend'));if(p&&(!gid||p.gid===gid))LS.del(LSK('hl-pend'))}catch(e){}}
function eloPend(){

function eloApply(won){
  try{
    if(!G||!G.pub||G.players.length!==2||!byPid(PID))return;
    if(LS.get(LSK('hl-elo-g'))===G.gid)return;
    /* The host phone decides what G says, so a hostile host could replay "finished games". Count a result only if this phone watched the game being played, at the range it asked for, and only once per room. */
    if(eloPlayGid!==G.gid||G.max!==playMode().max||(eloRoom&&eloRoom===code))return;
    eloRoom=code||'solo';
    const opp=G.players.find(p=>p.pid!==PID);if(!opp)return;
    LS.set(LSK('hl-elo-g'),G.gid);
    const me=myElo(),oe=eloOpp(opp,myElo()),ex=1/(1+Math.pow(10,(oe-me)/400));

    const to=Math.min(3000,Math.max(100,me+d));

    eloLast={gid:G.gid,d:to-me,from:me,to,up:rankName(to)!==rankName(me)&&to>me};

/* The other human of a rated duel dropped off the network and is not replaced yet: leaving then is not a forfeit. Only the host can tell, and only while its own connection is up. */
function oppVanished(){

    const m=byPid(PID),opp=G.players.find(p=>p.pid!==PID);if(!m||!m.a||!opp)return 0;
    if(LS.get(LSK('hl-elo-g'))===G.gid||oppVanished())return 0;

      if (phase !== 'ask') return;
      if (!R.touched) sfx('pick');
      R.touched = true; R.demo = false; R.auto = null; R.idle0 = clock; R.drag = true;
      try { sld.setPointerCapture(e.pointerId); } catch (_) {}
      sld.classList.add('drag', 'jump'); setTimeout(function () { sld.classList.remove('jump'); }, 150);   // a tap glides the thumb there
      $('#paHand').classList.remove('on'); $('#paGo').classList.add('pulse'); at_(e); e.preventDefault();
    });
    sld.addEventListener('pointermove', function (e) { if (R.drag) { R.idle0 = clock; sld.classList.remove('jump'); at_(e); } });
    var up = function () { if (R.drag) { R.drag = false; sld.classList.remove('drag'); R.idle0 = clock; } };
    sld.addEventListener('pointerup', up); sld.addEventListener('pointercancel', up);
    sld.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (!d || phase !== 'ask') return;
      R.touched = true; R.demo = false; R.idle0 = clock; $('#paGo').classList.add('pulse'); setX(R.x + d, true); e.preventDefault();
    });
    $('#paGo').addEventListener('click', function () { if (phase === 'ask') { R.touched = true; ask(); } });
    root.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  /* the bar always shows the live range [vlo, vhi]; the thumb, the yellow fill and the red "chopped" blocks are all placed from it */
  function fOf(v) { return R.vhi === R.vlo ? 0.5 : (v - R.vlo) / (R.vhi - R.vlo); }
  function place(x) {
    var f = fOf(x), p = 'calc(19px + (100% - 38px) * ' + f.toFixed(4) + ')';
    $('#paThumb').style.left = p; $('#paFill').style.width = p; $('#paHand').style.left = p;
  }
  function setView(a, b) { R.vlo = a; R.vhi = b; }
  function placeCuts(nlo, nhi) {      // the ruled-out numbers: everything below nlo, everything above nhi
    $('#paCutL').style.width = 'calc((100% - 38px) * ' + Math.max(0, fOf(nlo - 0.5)).toFixed(4) + ')';
    $('#paCutR').style.left = 'calc((100% - 38px) * ' + fOf(nhi + 0.5).toFixed(4) + ' + 38px)';
  }
  function setEnds(a, b) {
    var l = $('#paLo'), h = $('#paHi');
    if (+l.textContent !== a) { l.textContent = a; pop(l); }
    if (+h.textContent !== b) { h.textContent = b; pop(h); }
  }
  function setX(x, tickSound) {
    x = Math.min(R.hi, Math.max(R.lo, Math.round(x)));
    var f = R.hi === R.lo ? 0.5 : (x - R.lo) / (R.hi - R.lo);
    if (x !== R.x && tickSound) {
      var now = performance.now();
      if (now - (R.tickAt || 0) > 70) { R.tickAt = now; sfx('tick', { vol: 0.5, rate: 0.9 + f * 0.5 }); }
    }
    R.x = x; place(x);
    $('#paNum').textContent = x;
    $('#paSld').setAttribute('aria-valuenow', x);
  }

  /* ------------------------------------------------ rounds */
  function pickDeath() {
    var d = forcedDeath;
    if (!d) { var pool = DEATHS.filter(function (k) { return k !== lastDeath; }); d = pool[Math.floor(Math.random() * pool.length)]; }
    forcedDeath = ''; lastDeath = d; return d;
  }
  function newGame() {
    gen++; tasks = []; clearTimeout(sceneTimer);
    R = { n: 0, lo: 1, hi: MAXN, plo: 1, phi: MAXN, vlo: 1, vhi: MAXN, x: 50, secret: 0, touched: false, demo: true, drag: false, idle0: 0, demo0: 0, auto: null, tickAt: 0, tw: 0 };
    root.classList.remove('ended');
    mount();
    round();
    // the goal, in the opponent's own speech bubble; the hidden card wobbles
    at(250, function () {
      if (phase !== 'ask' || R.n) return;
      $('#paAns').innerHTML = '<span class="pa-ans-in say">Guess my number!</span>';
      $('#paAns').className = 'pa-ans on';
      $('#paCard').classList.add('wob');
      oppMood('talk'); sfx('hint', { vol: 0.8 });
    });
    at(1500, function () { if (phase === 'ask' && !R.n) oppMood('idle'); });
  }
  function round() {
    setPhase('ask');
    R.touched = false; R.demo = true; R.drag = false; R.auto = null; R.idle0 = clock; R.demo0 = clock + (R.tw ? 500 : 0);
    setView(R.lo, R.hi);
    setEnds(R.lo, R.hi);
    $('#paSld').classList.toggle('tw', !!R.tw);
    if (R.tw) at(520, function () { $('#paSld').classList.remove('tw'); });
    $('#paCutL').className = 'pa-cut l'; $('#paCutR').className = 'pa-cut r';
    $('#paGo').disabled = false; $('#paGo').classList.remove('pulse');
    pop($('#paSay'));
    meMood('talk');
    setX(Math.floor((R.lo + R.hi) / 2), false);
    $('#paHand').classList.toggle('on', R.n < 2);   // the drag hint, first two rounds
    at(R.n === 0 ? 350 : 250, function () { if (phase === 'ask' && !R.touched && R.n < 2) $('#paHand').classList.add('on'); });
  }

  /* per-frame: demo drag, auto-advance */
  function frame() {
    if (!R || phase !== 'ask') return;
    var span = R.hi - R.lo;
    if (R.auto) {
      var k = Math.min(1, (clock - R.auto.t0) / 350); k = 1 - Math.pow(1 - k, 3);
      setX(R.auto.from + (R.auto.to - R.auto.from) * k, false);
      return;
    }
    if (R.demo && clock > R.demo0) setX((R.lo + R.hi) / 2 + Math.sin((clock - R.demo0) / 650) * span * 0.3, false);
    var idle = clock - R.idle0;
    if (!R.drag && idle > (R.touched ? IDLE_TOUCHED_MS : IDLE_MS)) autoAdvance();
  }
  function autoAdvance() {
    // the ad must never stall: move to a suggested guess (the middle), then ask
    var to = R.touched ? R.x : Math.floor((R.lo + R.hi) / 2), my = gen;
    R.demo = false; R.auto = { t0: clock, from: R.x, to: to };
    $('#paHand').classList.remove('on'); $('#paGo').classList.add('pulse');
    at(500, function () { if (my === gen && phase === 'ask' && R.auto) ask(); });
  }

  /* squeeze: flash the ruled-out part, chop it away with a thud, then rescale what is left to fill the whole bar */
  function squeeze(nlo, nhi, final) {
    placeCuts(nlo, nhi);
    $('#paCutL').className = 'pa-cut l on chop'; $('#paCutR').className = 'pa-cut r on chop';
    at(260, function () {
      sfx('k_crack', { vol: 0.7, rate: 1.7 }); sfx('land', { vol: 1, delay: 0.02 });
      $('#paSld').classList.add('tw', 'jolt'); at(500, function () { $('#paSld').classList.remove('jolt'); });
      if (final) setView(nlo - 0.6, nhi + 0.6); else setView(nlo, nhi);
      placeCuts(nlo, nhi); place(R.x);
      setEnds(nlo, nhi);
      $('#paCutL').classList.add('gone'); $('#paCutR').classList.add('gone');
      var me = $('#paMe'); meMood('happy'); me.classList.remove('hop'); void me.offsetWidth; me.classList.add('hop');
    });
  }

  function ask() {
    if (phase !== 'ask') return;
    setPhase('think');
    var x = R.x; R.auto = null; R.demo = false; R.n++;
    var pips = $('#paPips').children; if (pips[R.n - 1]) pips[R.n - 1].className = 'on';
    $('#paGo').disabled = true; $('#paGo').classList.remove('pulse'); $('#paHand').classList.remove('on');
    $('#paAns').className = 'pa-ans';
    sfx('send');
    meMood('talk'); pop($('#paSay'));
    oppMood('talk');
    R.tw = 1;
    if (R.n < 3) {
      // Kind rig: the answer always keeps the bigger half, so the viewer is never boxed in.
      var higher = (R.hi - x) >= (x - R.lo);
      if (x >= R.hi) higher = false; else if (x <= R.lo) higher = true;
      var nlo = higher ? x + 1 : R.lo, nhi = higher ? R.hi : x - 1;
      at(300, function () {
        setPhase('answer');
        $('#paAns').innerHTML = '<span class="pa-ans-in ' + (higher ? 'hi' : 'lo') + '"><i class="pa-arr">' + (higher ? UP : DN) + '</i><b class="dirword ' + (higher ? 'hi' : 'lo') + '">' + (higher ? 'HIGHER' : 'LOWER') + '</b></span>';
        $('#paAns').className = 'pa-ans on';
        sfx(higher ? 'yes' : 'nope');
        nerve(R.n);
        R.plo = R.lo; R.phi = R.hi; R.lo = nlo; R.hi = nhi;
        squeeze(nlo, nhi, false);
      });
      at(1650, round);
    } else {
      // Third guess: the secret is whatever the viewer picked (inside the remaining range), so it is always right.
      R.secret = x;
      at(300, function () {
        setPhase('answer');
        $('#paSecret').textContent = x;
        $('#paCard').classList.add('rev');
        $('#paAns').innerHTML = '<span class="pa-ans-in ok"><i class="pa-tick">' + TICK + '</i></span>';
        $('#paAns').className = 'pa-ans on';
        sfx('yes');
        nerve(3);
        R.plo = R.lo; R.phi = R.hi; R.lo = x; R.hi = x;
        squeeze(x, x, true);
      });
      at(1500, scene);
    }
  }

  /* ------------------------------------------------ the death scene: one of the game's own scenes, never the same twice in a row */
  function scene() {
    setPhase('scene');
    var ov = $('#ov'), k = deathNow = pickDeath();
    ov.innerHTML = '<div class="sheet center pa-sheet"><div class="stage" data-death="' + k + '">' + SCENES[k](OPP, null, String(R.secret)) + '</div></div>';
    ov.hidden = false;
    deathSfx(k);
    at(CUT_MS[k], function () { ov.hidden = true; ov.innerHTML = ''; end(); });
  }

  /* ------------------------------------------------ end card */
  function end() {
    setPhase('end');
    var conf = '';
    for (var i = 0; i < 26; i++) conf += '<i class="fall" style="left:' + ((i * 37) % 96) + '%;animation-delay:' + (((i * 53) % 24) / 10).toFixed(2) + 's;background:' + COLORS[i % 6] + '"></i>';
    var to = ELO_FROM + ELO_D, a = Math.round(rankFrac(ELO_FROM) * 100), b = Math.round(rankFrac(to) * 100);
    var er = '<div class="er"><div class="elo-res up" id="paElo"><span class="d">' + eloDeltaTxt(ELO_D) + '</span><b id="paEloN">' + ELO_FROM + '</b><span class="rk"><span class="bd">' + rankBadge(to) + '</span><span class="nm">' + rankName(to) + '</span></span></div><div class="er-bar" style="--a:' + a + '%;--b:' + b + '%"><i></i></div></div>';
    var el = D.createElement('div'); el.id = 'paEnd'; el.className = 'pa-end';
    el.innerHTML = '<button class="pa-replay" id="paReplay" aria-label="Replay">' + REPLAY + '</button>' +
      '<h1 class="logo big">High<span>&amp;</span>Low</h1>' +
      '<div class="sheet center pa-win"><div class="stage">' + conf + '<div class="actor a-hop">' + charSVG(ME, 'happy') + '</div></div><h2>You win!</h2>' + er + '</div>' +
      '<p class="pa-line">Now beat a real player</p><button class="btn go big pa-cta" id="paCta">Play free</button>';
    root.appendChild(el); root.classList.add('ended');
    var fired = 0;
    el.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('#paReplay')) return;
      sfx('pick'); fire();
    });
    $('#paReplay').addEventListener('click', function (e) { e.stopPropagation(); sfx('pick'); newGame(); });
    sfx('win');
    var t0 = clock;
    (function cnt() {
      // the rating counts up from 1000 to 1020
      at(30, function () {
        var k = Math.min(1, Math.max(0, (clock - t0 - 450) / 900)); k = 1 - Math.pow(1 - k, 3);
        var n = $('#paEloN'); if (n) n.textContent = Math.round(ELO_FROM + ELO_D * k);
        if (k < 1) cnt();
      });
    })();
    try { W.HLP && W.HLP.end && W.HLP.end(); } catch (e) {}
  }
  function fire() { try { W.HLP && W.HLP.cta && W.HLP.cta(); } catch (e) {} }

  /* ------------------------------------------------ lifecycle */
  function pause() {
    if (paused) return; paused = true; D.body.classList.add('pa-paused');
    try { ctx && ctx.suspend(); } catch (e) {}
  }
  function resume() {
    if (!started) return start();
    if (!paused) return; paused = false; lastT = performance.now(); D.body.classList.remove('pa-paused');
    try { ctx && ctx.resume(); } catch (e) {}
  }
  function start() {
    if (started) return resume();
    started = true; paused = false; lastT = performance.now();
    newGame();
  }
  function init() {
    root = $('#ad');
    $('#sky').innerHTML = homeSceneHTML();
    fit(); W.addEventListener('resize', fit); W.addEventListener('orientationchange', fit);
    setInterval(tick, 30);
    D.addEventListener('visibilitychange', function () { if (D.hidden) pause(); else if (started) resume(); });
    W.addEventListener('pagehide', pause);
    var g = { start: start, pause: pause, resume: resume };
    g.setDeath = function (k) { forcedDeath = k; };
    g.death = function () { return deathNow; };
    g.audioState = function () { return ctx ? ctx.state : 'none'; };
    W.__hlad = g;
    if (W.HLP && W.HLP.boot) W.HLP.boot(g); else start();
  }
  if (D.readyState === 'loading') D.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body></html>
